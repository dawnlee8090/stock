<title>현지 금형 육성 관리</title>
<link rel="icon" href="/favicon.ico">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 현지 금형 육성 관리: 왼쪽 내비(차종 → 외주처) + 위 검색 + 본문. 업무 비서와 같은 디자인, 따로 실행하는 앱 */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --line: #dbe0e8; --line-2: #e8ecf1;
  --fg: #17202b; --fg-2: #586477; --fg-3: #8a94a5;
  --accent: #0e6a86; --accent-weak: #e0f0f5; --accent-fg: #ffffff;
  --crit: #c4362b; --crit-weak: #fbe9e7; --warn: #b9700c; --warn-weak: #fdf1df; --ok: #2b7d50; --ok-weak: #e3f3ea;
  --info: #3b5bb5; --info-weak: #e7ecfa; --mute-weak: #eceff3;
  --side: #17222e; --side-fg: #c9d3df; --side-fg-2: #7f8ea1; --side-active: #233344;
  --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #161d26; --surface-2: #1b232e; --line: #283241; --line-2: #212a36;
  --fg: #e5eaf0; --fg-2: #a2adbd; --fg-3: #6f7b8c;
  --accent: #4fb2cf; --accent-weak: #15303b; --accent-fg: #06222b;
  --crit: #f07468; --crit-weak: #3a1d1b; --warn: #e3a54a; --warn-weak: #36280f; --ok: #5cc28a; --ok-weak: #15301f;
  --info: #8ea7f0; --info-weak: #1d2640; --mute-weak: #222b37;
  --side: #0b1016; --side-fg: #c9d3df; --side-fg-2: #6f7d8f; --side-active: #1a2532;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #161d26; --surface-2: #1b232e; --line: #283241; --line-2: #212a36;
  --fg: #e5eaf0; --fg-2: #a2adbd; --fg-3: #6f7b8c;
  --accent: #4fb2cf; --accent-weak: #15303b; --accent-fg: #06222b;
  --crit: #f07468; --crit-weak: #3a1d1b; --warn: #e3a54a; --warn-weak: #36280f; --ok: #5cc28a; --ok-weak: #15301f;
  --info: #8ea7f0; --info-weak: #1d2640; --mute-weak: #222b37;
  --side: #0b1016; --side-fg: #c9d3df; --side-fg-2: #6f7d8f; --side-active: #1a2532;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 셸 ---------- */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; gap: 4px;
  padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.brand b { display: block; font-size: 15px; color: #fff; letter-spacing: -.01em; }
.brand span { font-size: 11px; color: var(--side-fg-2); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: var(--side-fg);
  text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--side-active); }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; min-width: 20px; text-align: center; padding: 1px 6px;
  border-radius: 10px; background: #2c3c4e; color: #dfe7f0; }
.nav .badge.crit { background: #8f2a22; color: #fff; }
.nav a.open { color: #fff; }
.subnav { display: grid; gap: 1px; margin: 2px 0 8px 22px; padding-left: 10px; border-left: 1px solid #2a3a4c; }
.nav a.sub-a { padding: 5px 8px; font-size: 13px; font-weight: 400; color: var(--side-fg-2); border-radius: 5px; }
.nav a.sub-a:hover { color: var(--side-fg); }
.nav a.sub-a[aria-current="page"] { color: #fff; background: var(--side-active); box-shadow: none; font-weight: 600; }
.nav .cnt { margin-left: auto; font-size: 11.5px; color: var(--side-fg-2); font-variant-numeric: tabular-nums; }
.nav .cnt.hot { color: #ffb4ab; font-weight: 600; }
.sub-sep { height: 1px; background: #2a3a4c; margin: 5px 8px; }
.nav a.sub-a.lvl1 { padding-left: 24px; font-size: 12.5px; }
.nav .caret { width: 0; height: 0; display: inline-block; margin: 0 2px 0 -2px; border: 4px solid transparent;
  border-left: 5px solid currentColor; border-right: 0; opacity: .7; transition: transform .15s; }
.nav .caret.open { transform: rotate(90deg); }
.sub-label { font-size: 10.5px; letter-spacing: .08em; color: var(--side-fg-2); padding: 2px 8px 0; opacity: .8; }
.subnav { max-height: 52vh; overflow-y: auto; }
.filters.mob { display: none; }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #243242; font-size: 12px; color: var(--side-fg-2);
  display: grid; gap: 6px; }
.mode { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.dot.live { background: #4ec98a; } .dot.demo { background: #e3a54a; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 12px; height: 38px; max-width: 640px; }
.search input[type=search]::-webkit-search-cancel-button { cursor: pointer; }
.search .btn { flex: none; }
.search input[type=search] { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; height: 100%; padding: 0; }
.search svg { width: 16px; height: 16px; color: var(--fg-3); flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn svg { width: 15px; height: 15px; }
.btn[disabled] { opacity: .55; cursor: default; }
.top .sync-time { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.demo-bar { background: var(--warn-weak); color: var(--warn); font-size: 12.5px; padding: 7px 20px; border-bottom: 1px solid var(--line); }
.demo-bar b { font-weight: 600; }

.view { flex: 1; overflow-y: auto; padding: 22px 24px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.view.split { padding: 0; overflow: hidden; display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); }
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 14px; margin: 0; font-weight: 600; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sub { color: var(--fg-2); font-size: 13px; }
.eyebrow { font-size: 11.5px; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }

/* ---------- 카드 · 칩 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.panel-h .sub { font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  background: var(--mute-weak); color: var(--fg-2); white-space: nowrap; }
.chip.crit { background: var(--crit-weak); color: var(--crit); }
.chip.warn { background: var(--warn-weak); color: var(--warn); }
.chip.ok { background: var(--ok-weak); color: var(--ok); }
.chip.info { background: var(--info-weak); color: var(--info); }
.chip.acc { background: var(--accent-weak); color: var(--accent); }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 15px; padding: 4px 11px; font-size: 12.5px; color: var(--fg-2); }
.filter[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.empty { padding: 28px 16px; text-align: center; color: var(--fg-3); font-size: 13px; }

/* 요약 타일 */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; text-align: left;
  display: grid; gap: 2px; position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.tile.crit::before { background: var(--crit); } .tile.warn::before { background: var(--warn); } .tile.ok::before { background: var(--ok); }
.tile:hover { border-color: var(--accent); }
.tile .k { font-size: 12px; color: var(--fg-2); font-weight: 500; }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .d { font-size: 11.5px; color: var(--fg-3); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }

.seg { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.seg [role=tab] { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font: inherit; font-size: 13.5px; color: var(--fg-2); cursor: pointer; margin-bottom: -1px; }
.seg [role=tab][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.seg .seg-link { margin-left: auto; padding: 8px 4px; }
/* 표 */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; letter-spacing: .03em; color: var(--fg-3); font-weight: 600; padding: 9px 12px;
  border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t td.c { text-align: center; }
.clip { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { font-size: 12px; color: var(--fg-2); margin-top: 2px; }

/* E.O 단계 */
.stages { display: flex; gap: 0; margin-bottom: 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stage { flex: 1 0 auto; min-width: 96px; padding: 10px 14px; border-right: 1px solid var(--line-2); text-align: left; background: transparent; border-top: 0; border-bottom: 0; border-left: 0; }
.stage:last-child { border-right: 0; }
.stage .k { font-size: 11.5px; color: var(--fg-2); font-weight: 500; }
.stage .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stage[aria-pressed="true"] { background: var(--accent-weak); box-shadow: inset 0 -2px 0 var(--accent); }
.st { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
/* 상세 서랍 */
.drawer-bg { position: fixed; inset: 0; background: rgba(10, 16, 24, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41;
  border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.wide { width: min(1000px, 100%); }
.drawer-h { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 16px; line-height: 1.4; flex: 1; }
.drawer-b { overflow-y: auto; padding: 16px 20px 28px; display: grid; gap: 18px; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.sect h3 { font-size: 12px; letter-spacing: .05em; color: var(--fg-3); margin: 0 0 8px; font-weight: 600; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 10px; }
.timeline li { position: relative; font-size: 12.5px; }
.timeline li::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline time { color: var(--fg-3); font-size: 11.5px; margin-right: 6px; }
.edit { display: grid; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.edit-row { display: flex; gap: 8px; flex-wrap: wrap; }
select, input[type=text], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 56px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.thumbs figure { margin: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.thumbs img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.thumbs figcaption { font-size: 11px; color: var(--fg-2); padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; font-size: 12.5px; }
.case b { font-size: 13px; }
/* 토스트 */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px);
  box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.copybox { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
.copybox code { font-family: var(--mono); flex: 1; min-width: 0; overflow-wrap: anywhere; }
/* 현지 금형 문제점 */
.lm-cars { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
table.lm-master td.mono { white-space: nowrap; }
table.lm-master td.n { text-align: center; font-variant-numeric: tabular-nums; }
table.lm-master td.n.z { color: var(--fg-3); }
table.lm-master th.c { text-align: center; }
.lm-filter { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.lm-filter select, .lm-filter input { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; height: 32px; padding: 0 8px; }
.lm-filter input { flex: 1 1 220px; min-width: 0; }
.lm-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.lm-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px;
  padding: 10px; cursor: pointer; text-align: left; font: inherit; color: inherit; align-items: start; }
.lm-card:hover { border-color: var(--accent); }
.lm-card.lm-drop, .lm-sheet.lm-drop { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-weak); }
.lm-card.lm-busy, .lm-sheet.lm-busy { opacity: .6; pointer-events: none; }
.lm-thumb { position: relative; width: 112px; aspect-ratio: 4 / 3; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
  display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--fg-3); flex: none; }
.lm-thumb.sm { width: 64px; }
.lm-thumb svg { width: 100%; height: 100%; display: block; }
.lm-cnt { position: absolute; right: 4px; bottom: 4px; background: rgba(20, 30, 40, .75); color: #fff; font-size: 10.5px; font-weight: 700; border-radius: 3px; padding: 0 5px; }
.lm-meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lm-pn { font-family: var(--mono); font-weight: 600; font-size: 13.5px; }
.lm-pname { font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lm-prob { font-size: 13.5px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.lm-row { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.lm-sheet { display: grid; grid-template-columns: 30px minmax(0, 1.4fr) 140px minmax(0, 1fr) 140px 120px; gap: 10px; align-items: start; padding: 10px 4px;
  border-bottom: 1px solid var(--line-2); cursor: pointer; font-size: 13px; }
.lm-sheet:hover { background: var(--surface-2); }
.lm-sheet.head { cursor: default; font-size: 11.5px; color: var(--fg-3); font-weight: 600; padding-bottom: 6px; }
.lm-sheet.head:hover { background: none; }
.lm-sheet > span { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.lm-mini { display: flex; gap: 4px; align-items: flex-end; flex-wrap: wrap; }
.lm-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; }
.lm-form .full { grid-column: 1 / -1; }
.lm-form label { display: grid; gap: 4px; font-size: 12px; color: var(--fg-2); font-weight: 500; }
.lm-form input, .lm-form select, .lm-form textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0; }
.lm-form textarea { min-height: 64px; resize: vertical; }
.lm-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.lm-group { border: 2px dashed transparent; border-radius: 8px; padding: 6px; display: grid; gap: 6px; align-content: start; }
.lm-group.active { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.lm-group.drag { border-color: var(--accent); background: var(--accent-weak); }
.lm-glab { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--fg-2); }
.lm-glab b { color: var(--fg); }
.lm-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.lm-tile { display: grid; gap: 4px; min-width: 0; }
.lm-tim { position: relative; width: 100%; aspect-ratio: 4 / 3; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #11161c; }
.lm-tim svg { width: 100%; height: 100%; display: block; }
.lm-tim .no { position: absolute; left: 4px; top: 4px; background: rgba(20, 30, 40, .75); color: #fff; font-size: 11px; font-weight: 700; border-radius: 3px; padding: 0 5px; }

function setupLmDrop(L) {

      } else if (b.dataset.act === 'mark') {
        const img = await loadImg(p.url).catch(() => null); if (!img) return toast('사진을 불러오지 못했습니다');
        const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0);
        const marks = await annotate(c, p.marks || [], p.grp); if (!marks) return;
        const r = await api(`photo/${pid}`, { marks, flat: marks.length ? flatten(c, marks) : '' });

  let depth = 0;

  box.addEventListener('dragover', (e) => { if (grpOf(e.target)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
  box.addEventListener('dragleave', (e) => { const g = grpOf(e.target); if (g && --depth <= 0) { depth = 0; g.classList.remove('drag'); } });
  box.addEventListener('drop', (e) => { const g = grpOf(e.target); if (!g) return; e.preventDefault(); depth = 0; g.classList.remove('drag'); lmCur.activeGrp = g.dataset.grp; lmAddFiles(L, g.dataset.grp, [...(e.dataTransfer?.files || [])], true); });
}

  finally { URL.revokeObjectURL(url); }
}

// direct = 끌어놓기 · Ctrl+V: 표시 화면 없이 바로 첨부 (표시는 나중에 '○ 표시'). 촬영 · 파일 한 장은 표시 화면부터
async function lmAddFiles(L, grp, all, direct) {
  const files = imageFiles(all);
  if (!files.length) { if (all.length) toast('사진 파일만 넣을 수 있습니다'); return; }
  if (!lmCur.id) { const ok = await saveLmIssue(L, true); if (!ok) return; }   // 새 문제점은 먼저 등록하고 사진을 붙인다
  const msg = $('#lm-msg', L);
  if (direct || files.length > 1) {
    msg.textContent = '사진 올리는 중…';
    const got = await lmUpload(lmCur.id, grp, files, (p) => { lmCur.photos.push(p); renderLmGroups(L); });
    msg.textContent = got.length ? `${LM_GRP[grp]} 칸에 ${got.length}장을 넣었습니다. '○ 표시'로 수정부위를 표시할 수 있습니다` : '';
    if (got.length) toast(`${LM_GRP[grp]} 칸에 ${got.length}장 첨부`);
    renderLmGroups(L);
    return;
  }
  try {
    const base = await shrink(files[0], 1800);
    const marks = await annotate(base, [], grp); if (marks === null) return;
    msg.textContent = '사진 올리는 중…';
    const r = await api(`issue/${lmCur.id}/photo`, { grp, data: base.toDataURL('image/jpeg', 0.86), marks, flat: marks.length ? flatten(base, marks) : '', w: base.width, h: base.height });
    if (r.photo) lmCur.photos.push(r.photo);
    msg.textContent = '';
  } catch (err) { toast('사진을 올리지 못했습니다: ' + err.message); }
  renderLmGroups(L);
}
// 목록(문제점 카드 · 을지 행)에 사진을 끌어 놓으면 그 문제점의 '수정 전' 칸에 바로 첨부
function lmDropTargets(root, sel, done) {
  root.__lmDrop = { sel, done };          // 화면을 다시 그려도 리스너는 한 번만 (두 번 올라가지 않게)
  if (root.__lmDropBound) return;
  root.__lmDropBound = true;
  let over = null;
  const tgt = (e) => e.target.closest?.(root.__lmDrop.sel);
  const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
  root.addEventListener('dragover', (e) => { const t = tgt(e); if (!t || !hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    if (over !== t) { over?.classList.remove('lm-drop'); over = t; t.classList.add('lm-drop'); } });
  root.addEventListener('dragleave', (e) => { const t = tgt(e); if (t && !t.contains(e.relatedTarget)) { t.classList.remove('lm-drop'); if (over === t) over = null; } });
  root.addEventListener('drop', async (e) => {
    const t = tgt(e); if (!t) return; e.preventDefault(); e.stopPropagation(); t.classList.remove('lm-drop'); over = null;
    const files = imageFiles(e.dataTransfer?.files); if (!files.length) return toast('사진 파일만 넣을 수 있습니다');
    t.classList.add('lm-busy');
    const got = await lmUpload(+t.dataset.issue, 'before', files);
    t.classList.remove('lm-busy');
    if (got.length) { toast(`L${t.dataset.issue} 수정 전 칸에 ${got.length}장 첨부`); root.__lmDrop.done && root.__lmDrop.done(); }
  });
}

// ----- 표시 편집기: 동그라미+라벨 · 동그라미 · 화살표+라벨 · 사각 · 펜 / 수정부위(빨강) · 리워크부위(파랑) -----
function annotate(base, initial, grp) {
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'lm-mk'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-label', '수정 부위 표시');
    wrap.innerHTML = `<div class="bar"><span class="t">수정 부위 표시</span>
      ${[['circleL', '◎ 동그라미+라벨'], ['circle', '○ 동그라미'], ['arrow', '➜ 화살표+라벨'], ['rect', '□ 사각'], ['pen', '펜']].map(([k, l]) => `<button class="btn sm tool" type="button" data-tool="${k}">${l}</button>`).join('')}
      <span class="cols"><button class="btn sm col" type="button" data-col="r"><i style="background:${MCOL.r}"></i>수정부위</button><button class="btn sm col" type="button" data-col="b"><i style="background:${MCOL.b}"></i>리워크부위</button></span>
      <label class="lbl">라벨<input id="mk-label"></label></div>
      <div class="hint" id="mk-hint"></div><div class="stage"><canvas></canvas></div>
      <div class="bar"><button class="btn sm" type="button" id="mk-undo">되돌리기</button><button class="btn sm" type="button" id="mk-clear">모두 지우기</button><span style="flex:1"></span>
        <button class="btn sm" type="button" id="mk-cancel">취소</button><button class="btn sm primary" type="button" id="mk-done">적용</button></div>`;
    document.body.appendChild(wrap);
    const cv = $('canvas', wrap), ctx = cv.getContext('2d'); cv.width = base.width; cv.height = base.height;
    const W = cv.width, H = cv.height, minWH = Math.min(W, H), DEF_R = minWH * 0.08;
    let tool = 'circleL', marks = JSON.parse(JSON.stringify(initial || [])), drawing = null, col = grp === 'after' ? 'b' : 'r';
    const HINTS = { circleL: '표시할 부위를 <b>톡 누르면</b> 동그라미와 라벨 화살표가 함께 그려집니다. 누른 채 끌면 크기를 조절합니다.', circle: '표시할 부위를 <b>톡 누르거나</b> 끌어서 동그라미를 그립니다.',
      arrow: '라벨을 둘 자리에서 <b>수정 부위 쪽으로 끌어</b> 화살표를 그립니다.', rect: '끌어서 점선 사각형을 그립니다.', pen: '손가락 · 마우스로 자유롭게 그립니다.' };
    const setTool = (t) => { tool = t; wrap.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t)); $('#mk-hint', wrap).innerHTML = HINTS[t] + ' 원본 사진은 그대로 두고 표시만 겹쳐 저장합니다.'; };
    const setCol = (c) => { const lb = $('#mk-label', wrap); if (!lb.value.trim() || lb.value.trim() === MLAB[col]) lb.value = MLAB[c]; col = c; wrap.style.setProperty('--mc', MCOL[c]); wrap.querySelectorAll('.col').forEach(b => b.setAttribute('aria-pressed', b.dataset.col === c)); };
    $('#mk-label', wrap).value = MLAB[col]; setCol(col); setTool('circleL');
    wrap.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
    wrap.querySelectorAll('.col').forEach(b => b.addEventListener('click', () => setCol(b.dataset.col)));
    const draw = () => { ctx.drawImage(base, 0, 0); drawMarks(ctx, drawing ? [...marks, drawing] : marks, W, H); };
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: r4(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))), y: r4(Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))) }; };
    const circleAt = (c, rpx) => ({ t: 'ellipse', a: { x: r4(c.x - rpx / W), y: r4(c.y - rpx / H) }, b: { x: r4(c.x + rpx / W), y: r4(c.y + rpx / H) } });
    const autoArrow = (cx, cy, pw, ph) => { const dx = cx < 0.5 ? 1 : -1, dy = cy < 0.5 ? 1 : -1, dd = 0.17 + Math.max(pw, ph) / 2;
      const tail = { x: r4(Math.min(0.88, Math.max(0.12, cx + dx * dd))), y: r4(Math.min(0.9, Math.max(0.1, cy + dy * dd * 0.75))) }, ang = Math.atan2(cy - tail.y, cx - tail.x);
      return { t: 'arrow', a: tail, b: { x: r4(cx - Math.cos(ang) * pw / 2 * 1.04), y: r4(cy - Math.sin(ang) * ph / 2 * 1.04) } }; };
    cv.onpointerdown = (e) => { cv.setPointerCapture(e.pointerId); const p = pos(e);
      if (tool === 'circle' || tool === 'circleL') { drawing = { ...circleAt(p, DEF_R), c: col, _c: p }; draw(); return; }
      drawing = tool === 'pen' ? { t: 'pen', p: [p], c: col } : { t: tool, a: p, b: p, c: col, ...(tool === 'arrow' ? { label: $('#mk-label', wrap).value.trim() } : {}) }; draw(); };
    cv.onpointermove = (e) => { if (!drawing) return; const p = pos(e);
      if (drawing._c) { const r = Math.hypot((p.x - drawing._c.x) * W, (p.y - drawing._c.y) * H); Object.assign(drawing, circleAt(drawing._c, Math.max(r, minWH * 0.02))); draw(); return; }
      if (drawing.t === 'pen') { drawing.p.push(p); } else drawing.b = p; draw(); };
    cv.onpointerup = cv.onpointercancel = () => { if (!drawing) return;
      const d = drawing; drawing = null;
      if (d.t === 'pen') { if (d.p.length > 1) marks.push({ t: 'pen', c: d.c, p: d.p.map(p => `${p.x},${p.y}`).join(';') }); }
      else if (d._c) { const m = { t: 'ellipse', a: d.a, b: d.b, c: d.c }; marks.push(m);
        if (tool === 'circleL') { const lab = $('#mk-label', wrap).value.trim(); marks.push({ ...autoArrow(d._c.x, d._c.y, Math.abs(d.b.x - d.a.x), Math.abs(d.b.y - d.a.y)), c: d.c, label: lab }); } }
      else if (Math.hypot((d.b.x - d.a.x) * W, (d.b.y - d.a.y) * H) > minWH * 0.02) { const { _c, ...m } = d; marks.push(m); }
      draw(); };
    const close = (v) => { wrap.remove(); document.removeEventListener('keydown', esc1, true); resolve(v); };
    const esc1 = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } };
    document.addEventListener('keydown', esc1, true);
    $('#mk-undo', wrap).onclick = () => { marks.pop(); draw(); };
    $('#mk-clear', wrap).onclick = () => { marks = []; draw(); };
    $('#mk-cancel', wrap).onclick = () => close(null);
    $('#mk-done', wrap).onclick = () => close(marks);
    draw();
  });
}

function lmDemoPriority(rows) {
  return rows.filter(r => r.status !== '종결' && r.status !== '보류').map(r => {
    const x = lmDemoRow(r), why = []; let s = 0;
    if (x.delay) { s += 100 + Math.min(+x.delay.match(/\d+/)[0], 60) * 2; why.push(x.delay); }
    else if (r.due && ['발생', '원인분석', '대책수립'].includes(r.status)) { const left = days(r.due); if (left >= 0 && left <= 3) { s += 20; why.push(`수정 목표 D-${left}`); } }
    if (r.importance === '상') { s += 80; why.push('중요도 상'); } else if (r.importance === '중') s += 30;
    if (x.wait) { s += 50; why.push(x.wait); }
    if (r.to_result === 'NG') { s += 40; why.push('수정 후 T/O NG'); }
    if (r.recur_of) { s += 30; why.push(`재발 ← L${r.recur_of}`); }
    if (r.mold_fix === 'O') s += 10;
    if (r.occ_date) s += Math.floor(Math.min(Math.max(-days(r.occ_date), 0), 60) / 6);
    return { ...x, score: s, why };

function emptyStart(V) {
  V.innerHTML = `<div class="head"><div><h1>현지 금형 육성 관리</h1><div class="sub">차종 → 외주처 → 금형(갑지) → 문제점(을지) · T/O 대장과 같은 단계로 관리</div></div></div>
    <section class="panel"><div class="empty" style="padding:36px 16px;display:grid;gap:10px;justify-items:center">
      <b style="color:var(--fg)">아직 등록된 차종이 없습니다</b>
      <span>차종의 <b>금형 리스트 엑셀</b>, 드라이브의 <b>외주처 문제점 엑셀</b>(갑지+을지+사진) 또는 <b>통합 문제점 리스트</b>를 올리면 차종이 만들어집니다.</span>
      <button class="btn primary" id="lm-up2" type="button">엑셀 · CSV 올리기</button>
      <span class="sub">업무 비서의 [현지 금형]에 넣어 둔 데이터가 있으면 한 번 옮길 수 있습니다:</span>${claudeBox('python -m localmold from-mailhub', '명령 복사')}</div></section>`;
  $('#lm-up2', V).addEventListener('click', () => lmImport(''));
}
async function viewHome(V, S) {
  V.className = 'view';
  if (!S.cars.length) return emptyStart(V);
  const t = S.total, vendors = new Set(S.cars.flatMap(x => x.vendors.map(v => x.car + '|' + v.vendor))).size;
  const tile = (k, v, d, sev) => `<div class="tile static ${sev || ''}"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  V.innerHTML = `<div class="head"><div><h1>전체 현황</h1><div class="sub">차종 ${S.cars.length} · 외주처 ${vendors} · 금형 ${t.molds}벌 · 문제점 ${t.issues}건 · 오늘 ${iso(TODAY)}</div></div></div>
    <div class="tiles">${tile('진행 중', t.open, `전체 ${t.issues}건`)}${tile('중요도 상 진행', t.hi_open, '먼저 챙길 건', t.hi_open ? 'warn' : '')}
      ${tile('수정 지연', t.late, '수정 목표일 지남', t.late ? 'crit' : '')}${tile('검증 T/O 필요', t.wait, '수정 후 결과 없음', t.wait ? 'warn' : '')}${tile('종결률', t.close_rate + '%', `종결 ${t.closed}건 (T/O OK)`, 'ok')}</div>
    <section class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>차종별</h2>${stageLegend()}</div>
      <div class="table-wrap"><table class="t"><thead><tr><th>차종</th><th class="c">외주처</th><th class="c">금형</th><th class="c">문제점</th><th class="c">진행</th><th class="c">중요도 상</th><th class="c">수정 지연</th><th class="c">검증 T/O</th><th class="c">종결률</th><th style="min-width:160px">단계</th></tr></thead>
      <tbody>${S.cars.map(x => `<tr data-car="${esc(x.car)}"><td><b>${esc(x.car)}</b></td><td class="c num">${x.vendors.length}</td><td class="c num">${x.molds}</td><td class="c num">${x.issues}</td>
        <td class="c num"><b>${x.open}</b></td><td class="c num" ${x.hi_open ? 'style="color:var(--warn);font-weight:600"' : ''}>${x.hi_open}</td>
        <td class="c num" ${x.late ? 'style="color:var(--crit);font-weight:700"' : ''}>${x.late}</td><td class="c num">${x.wait}</td><td class="c num">${x.close_rate}%</td><td>${stageBar(x.stages || {})}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><div class="panel-h"><h2>작업 우선순위 <span class="sub" style="font-weight:400">상위 10</span></h2><a class="btn sm" href="#top">전체 보기</a></div>
      <div class="sub" style="padding:8px 16px 0">수정 지연 &gt; 중요도 상 &gt; 검증 T/O · NG &gt; 재발 &gt; 수정 목표 임박 순 · 사진을 행에 끌어 놓으면 그 문제점의 수정 전 칸에 첨부</div>
      <ol class="prio">${S.top.slice(0, 10).map(prioRow).join('') || '<li class="empty">진행 중 문제점이 없습니다</li>'}</ol></section>
`;
  V.querySelectorAll('tr[data-car]').forEach(tr => tr.addEventListener('click', () => { location.hash = carHash(tr.dataset.car); }));
  bindPrio(V);
}

// ================= 화면: 작업 우선순위 =================
let topState = { car: '' };
async function viewTop(V, S) {
  V.className = 'view';
  if (!S.cars.length) return emptyStart(V);
  const d = await api(`top?car=${encodeURIComponent(topState.car)}&limit=60`);
  V.innerHTML = `<div class="head"><div><h1>작업 우선순위</h1><div class="sub">출장 · 현지 점검 때 먼저 볼 문제점. 점수 = 수정 지연(오래될수록) &gt; 중요도 상 &gt; 검증 T/O 필요 · T/O NG &gt; 재발 &gt; 수정 목표 임박</div></div>
    <div class="chips"><select id="tp-car" aria-label="차종"><option value="">전체 차종</option>${S.cars.map(x => `<option ${x.car === topState.car ? 'selected' : ''}>${esc(x.car)}</option>`).join('')}</select></div></div>
    <section class="panel"><ol class="prio">${d.issues.map(prioRow).join('') || '<li class="empty">진행 중 문제점이 없습니다</li>'}</ol></section>
    <div class="sub" style="margin-top:10px">Claude 에서 출장 점검 목록 만들기: <span class="mono">python -m localmold top --car "차종" --json</span></div>`;
  $('#tp-car', V).addEventListener('change', (e) => { topState.car = e.target.value; route(); });
  bindPrio(V);
}

// ================= 화면: 검색 결과 =================
async function viewFind(V, S, q) {
  V.className = 'view';
  const d = await api('find?q=' + encodeURIComponent(q));
  V.innerHTML = `<div class="head"><div><h1>검색: ${esc(q)}</h1><div class="sub">모든 차종에서 품번 · 품명 · 문제점 · 대책 · 외주처 · L번호 · ${d.issues.length}건</div></div></div>
    <div class="lm-cards">${d.issues.map(lmCard).join('') || '<div class="empty">찾은 문제점이 없습니다</div>'}</div>`;
  V.querySelectorAll('[data-issue]').forEach(b => b.addEventListener('click', () => openLmIssue(+b.dataset.issue)));
  lmDropTargets(V, '.lm-card[data-issue]', () => route());
}

// ================= 화면: 폰 사진 접수 =================
async function viewPhone(V, S) {
  V.className = 'view';
  const url = S.phone_page || '';
  V.innerHTML = `<div class="head"><div><h1>폰 사진 접수</h1><div class="sub">현지 · 출장 중 휴대폰으로 찍은 문제점 사진을 올리고, PC 에서 문제점 사진 칸으로 들여옵니다</div></div></div>
    <div class="grid2">
      <section class="panel"><div class="panel-h"><h2>순서</h2></div><ol class="steps">
        <li><b>폰</b>: 아래 페이지(claude.ai 비공개)를 열어 차종 · 외주처 · 품번 → 진행 중 문제점(또는 새 문제점) → 촬영 · 표시 → 올리기</li>
        <li><b>PC · Claude Code</b>: <span class="mono">/local-sync</span> 를 실행하면 반영 대기 사진을 받아 보여 줍니다 (확인 후 들여오기)</li>
        <li><b>이 앱</b>: 해당 문제점의 수정 전/후 칸에 '폰' 표시와 함께 들어갑니다. 폰 페이지의 [올린 사진]은 'PC 반영 · L번호'로 바뀝니다</li>
        <li><b>목록 맞추기</b>: 들여온 뒤 폰에서 고르는 금형 · 진행 중 문제점 · L번호를 PC 와 같게 다시 보냅니다 (<span class="mono">python -m localmold snapshot</span>)</li></ol></section>
      <section class="panel"><div class="panel-h"><h2>폰 페이지</h2></div><div style="padding:14px 16px;display:grid;gap:10px">
        ${url ? `<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">현지 금형 사진 접수 페이지 열기</a><span class="mono sub" style="overflow-wrap:anywhere">${esc(url)}</span>` : '<span class="sub">localmold.toml 의 phone_page 에 주소를 적어 주세요</span>'}
        <span class="sub">페이지는 비공개입니다. 현지 직원 · 출장자가 올리려면 페이지의 Share 메뉴에서 편집 권한을 주세요.</span>
        ${claudeBox('/local-sync', '명령 복사')}</div></section>
    </div>`;
}

// ================= 라우팅·시작 =================
let SUMMARY = null;
async function route() {
  const R = parseHash();
  $('#layer').innerHTML = '';
  const V = $('#view');
  try {
    SUMMARY = await api('summary');
    renderNav(SUMMARY);
    if (R.k === 'car' && R.a) await viewCar(V, SUMMARY, R.a, R.b);
    else if (R.k === 'top') await viewTop(V, SUMMARY);
    else if (R.k === 'find' && R.a) await viewFind(V, SUMMARY, R.a);
    else if (R.k === 'phone') await viewPhone(V, SUMMARY);
    else await viewHome(V, SUMMARY);
  } catch (e) { V.className = 'view'; V.innerHTML = `<div class="empty">화면을 불러오지 못했습니다: ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', route);
function runSearch() { const q = $('#q').value.trim(); if (!q) return; const h = '#find/' + encodeURIComponent(q); if (location.hash === h) route(); else location.hash = h; }
$('#search-form').addEventListener('submit', (e) => { e.preventDefault(); runSearch(); });
let searchAfterIME = false;   // 한글 조합 중 Enter
$('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) { searchAfterIME = true; e.preventDefault(); } });
$('#q').addEventListener('compositionend', () => { if (searchAfterIME) { searchAfterIME = false; setTimeout(runSearch, 0); } });
$('#up-btn').addEventListener('click', () => { const R = parseHash(); lmImport(R.k === 'car' ? R.a : ''); });
const APP_VERSION = '2026-11-12.2';   // localmold/webapp.py 의 APP_VERSION 과 같게
function showFatal(msg) {
  const V = $('#view'); if (!V) return;
  V.className = 'view';
  V.innerHTML = `<div class="panel" style="max-width:720px;padding:18px 20px;border-color:var(--crit)">
    <h2 style="color:var(--crit)">화면을 그리는 중 오류가 났습니다</h2>
    <p class="sub" style="margin:8px 0">앱을 껐다 켜면 대부분 해결됩니다: 작업 표시줄의 작은 검은 창 <b>현지 금형</b>을 닫고 다시 실행하세요. 그래도 같으면 아래 내용을 캡처해서 보내 주세요.</p>
    <pre style="white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:6px;font-size:12px;margin:0">${esc(msg)}</pre>
    <div style="margin-top:12px"><button class="btn sm" type="button" onclick="location.reload()">다시 불러오기</button></div></div>`;
}
window.addEventListener('error', (e) => showFatal((e.message || '') + (e.filename ? `\n${e.filename}:${e.lineno}` : '')));
window.addEventListener('unhandledrejection', (e) => showFatal(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
async function start() {
  let serverVersion = '';
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 1500);
    const r = await fetch('/api/ping', { signal: ctl.signal });
    if (r.ok) { const j = await r.json(); LIVE = !!j.ok && j.app === 'localmold'; serverVersion = j.version || '예전 버전'; }
  } catch { LIVE = false; }
  $('#mode-dot').className = 'dot ' + (LIVE ? 'live' : 'demo');
  $('#mode-text').textContent = LIVE ? '내 PC 데이터 연결됨' : '예시 데이터';
  $('#demo-bar').hidden = LIVE;
  if (LIVE && serverVersion !== APP_VERSION) {
    const bar = $('#demo-bar'); bar.hidden = false;
    bar.innerHTML = `<b>앱을 다시 켜 주세요</b> · 화면은 새 버전인데 엔진은 예전 버전(${esc(serverVersion)})입니다. 작은 검은 창 <b>현지 금형</b>을 닫고 다시 실행하세요.`;
  }
  route();
}
start();
})();
</script>
