# config.example.toml 을 config.toml 로 복사한 뒤 수정하세요.
# 수정 후에는 `python -m mailhub retag` 로 기존 메일도 다시 분류됩니다.

[archive]
db_path = "data/mailhub.db"        # 검색 DB (메일 10만 건 ≈ 1~2GB)
msg_dir = "data/msg"               # --save-msg 원본 보관 위치
attach_dir = "data/attachments"    # --save-attachments 첨부 보관 위치

[imap]
# 그룹웨어 메일 서버 정보 (그룹웨어 환경설정 > 메일 > POP3/IMAP 설정 화면 참고)
# 비밀번호는 여기 적지 마세요. `python -m mailhub imap-setup` 실행 시 안전하게 저장됩니다.
host = "imap.company.com"
port = 993
ssl = true
user = "my.id"            # 아이디 또는 메일 주소 (그룹웨어 안내대로)
# folders = ["INBOX", "Sent"]   # 일부 폴더만 수집할 때 (기본: 휴지통·스팸·임시보관 제외 전체)

[pop]
# IMAP 권한이 없을 때 대안 (POP3 미리보기). 아웃룩 계정 설정 > 기타 설정 > 고급 탭의 포트/SSL 참고
host = "pop.company.com"
port = 995          # SSL 이면 995, 아니면 110
ssl = true
user = "my.id@company.com"

[me]
# 내 메일 주소와 이름 (아웃룩 받는사람 칸은 이름으로 표시되므로 둘 다 입력)
# → 내가 보낸 메일 구분, 참조(CC)로만 받은 메일·이미 회신한 건은 '조치필요'에서 제외
addresses = ["my.name@company.com"]
names = ["홍길동"]

[tags]
# 태그명 = [키워드...]  (대소문자 무시 / 제목·본문·첨부파일명에서 검색)
# 기본 태그(E.O, T/O, 금형수정, 검사구, 품질문제, 금형이관, 일정, 설계반영)는 그대로 있고,
# 아래처럼 같은 이름을 쓰면 교체, 새 이름을 쓰면 추가됩니다.
"고객사-현대" = ["hyundai.com", "현대자동차"]
"고객사-기아" = ["kia.com", "기아"]
"금형업체" = ["@mold-vendor.co.kr", "OO정밀"]
"검사구업체" = ["@cf-vendor.co.kr", "OO치공구"]
# "차종-XX1" = ["XX1", "XX1 PE"]
# 주의: 업체 태그에는 '금형', '검사구' 같은 일반 단어 대신 업체 메일 도메인·회사명만 넣으세요.

[action]
# 이 키워드가 제목/최신 본문에 있으면 ★조치필요 로 표시
keywords = ["요청", "검토 부탁", "검토부탁", "검토 바랍", "검토바랍", "회신", "확인 부탁", "확인부탁",
            "확인 바랍", "확인바랍", "긴급", "ASAP", "URGENT", "협조 부탁", "의견 부탁", "제출 바랍"]
# 조치필요에서 제외: 보낸사람(주소/이름 일부), 제목 일부, 받는사람 수가 max_to 초과인 단체 메일
ignore_senders = ["postmaster", "noreply", "no-reply", "donotreply", "mailer-daemon", "rpabot", "notification", "system"]
ignore_subjects = ["[전사", "[공지", "공지]", "[안내]", "quota warning", "게시글이 등록", "게시글 등록",
                   "자동 발송", "자동발송", "undeliverable", "배달되지 않음", "부재중", "out of office"]
max_to = 10

[part_number]
# 품번 정규식 (회사 품번 체계에 맞게 추가)
patterns = ['\b\d{5}-[A-Z0-9]{5}\b']
