<style>

  padding: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px)); --mc: var(--mark-r); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); }
@media (max-width: 560px) { .row2 { grid-template-columns: minmax(0, 1fr); } .cards { grid-template-columns: minmax(0, 1fr); } .card { grid-template-columns: 96px minmax(0, 1fr); } .card .th { width: 96px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div><div class="sub" id="subline">현장 촬영 → PC 업무 비서</div><h1>현지 금형 사진 접수</h1></div>
    <nav class="tabs" role="tablist" aria-label="보기">

  </header>

  <section id="vUp" class="up">

      <h2><span class="n">1</span>금형 고르기<span class="hint" id="catHint"></span></h2>

        <label class="f">차종<select id="car"></select></label>
        <label class="f">품번 · 품명 검색<input class="search" id="pq" type="search" placeholder="예: 84611, CONSOLE" autocomplete="off" autocapitalize="characters"></label>
      </div>
      <div class="chips" id="vendors" role="group" aria-label="외주처"></div>
      <ul class="plist" id="plist" hidden></ul>
      <div class="sel" id="selMold" hidden></div>
      <details id="manual"><summary class="pname">목록에 없는 금형 직접 입력</summary>
        <div class="row2" style="margin-top:8px">
          <label class="f">차종<input id="mCar" placeholder="예: BC4t CUV"></label>
          <label class="f">외주처<input id="mVendor" placeholder="예: ASHA-2" autocapitalize="characters"></label>
          <label class="f">품번<input id="mPn" placeholder="예: 86511-BNGA0" autocapitalize="characters"></label>
          <label class="f">품명<input id="mName" placeholder="예: COVER ASSY-FR BUMPER UPR"></label>

        <label class="f">유형<select id="nCat"><option>습합</option><option>취출</option><option>WELD LINE</option><option>SINK</option><option>미성형</option><option>GAS</option><option selected>기타</option></select></label>
        <label class="f">중요도<select id="nImp"><option value="">-</option><option>상</option><option>중</option><option>하</option></select></label>

    <div class="step">

      <div class="seg" role="group" aria-label="사진 칸"><button type="button" id="gBefore" aria-pressed="true">수정 전 (문제)</button><button type="button" id="gAfter" aria-pressed="false">수정 후 (개선 · 리워크)</button></div>

</div>

<script>
(() => {
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IMP = { '상': 'crit', '중': 'warn', '하': '' };
const ST = { '발생': 'crit', '원인분석': 'warn', '대책수립': 'warn', '대책적용': 'acc', '효과확인': 'ok' };
let db = null, assets = null, user = null, me = null, editor = false;
let catalog = [], uploads = [], profiles = {}, loaded = false;
const sel = { car: '', vendor: '', mold: null, issue: '' };   // issue: 문제점 키 또는 'new'
let queue = [], grp = 'before', sending = false;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 3200); }
function notice(t) { $('notice').hidden = !t; $('notice').textContent = t || ''; }
const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 무시 */ } };

/* ---------- 표시 (업무 비서 · 검토서와 같은 방식: 원본 위 0~1 비율 좌표) ---------- */
const MCOL = { r: '#e8261c', b: '#1565d8' }, MLAB = { r: '수정부위', b: '리워크부위' };
const r4 = n => Math.round(n * 10000) / 10000;
const markLW = (W, H) => Math.max(3, Math.max(W, H) / 140);
function labelBox(t, fs) { let w = 0; for (const ch of t) w += ch.charCodeAt(0) > 0x2000 ? fs : fs * 0.62; return { w: w + fs * 1.1, h: fs * 1.7 }; }
function parsePts(p) { return typeof p === 'string' ? p.split(';').filter(Boolean).map(s => { const [x, y] = s.split(','); return { x: +x, y: +y }; }) : (p || []); }
function svgMarks(marks, W, H) {
  const lw = markLW(W, H); let out = '', labels = '';
  for (const m of (marks || [])) {
    const R = MCOL[m.c] || MCOL.r, ax = m.a?.x * W, ay = m.a?.y * H, bx = m.b?.x * W, by = m.b?.y * H;
    if (m.t === 'ellipse') out += `<ellipse cx="${(ax + bx) / 2}" cy="${(ay + by) / 2}" rx="${Math.abs(bx - ax) / 2}" ry="${Math.abs(by - ay) / 2}" fill="none" stroke="${R}" stroke-width="${lw}"/>`;
    else if (m.t === 'rect') out += `<rect x="${Math.min(ax, bx)}" y="${Math.min(ay, by)}" width="${Math.abs(bx - ax)}" height="${Math.abs(by - ay)}" fill="none" stroke="${R}" stroke-width="${lw}" stroke-dasharray="${lw * 2.5} ${lw * 1.5}"/>`;
    else if (m.t === 'pen') out += `<polyline points="${parsePts(m.p).map(p => `${p.x * W},${p.y * H}`).join(' ')}" fill="none" stroke="${R}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/>`;

      const p = queue[0];
      $('sendMsg').textContent = `올리는 중… ${done + 1} / ${done + queue.length}`;
      const a = await assets.upload(await blobOf(p.base), { type: 'image/jpeg' });
      const f = p.marks.length ? await assets.upload(await blobOf(flatten(p.base, p.marks)), { type: 'image/jpeg' }) : null;
      await db.collection('uploads').add({ ...base, grp: p.grp, asset: a.id, flat: f ? f.id : '', w: p.base.width, h: p.base.height, marks: p.marks, at: new Date().toISOString() });
      queue.shift(); done++; renderTiles();
    }
    $('memo').value = ''; if (sel.issue === 'new') { $('nProb').value = ''; }
    toast(`${done}장을 올렸습니다. PC 업무 비서에서 /local-sync 로 들여옵니다`);
  } catch (err) {
    const code = err?.code || '';
    toast(code === 'too_large' ? '사진이 너무 큽니다' : code === 'quota_or_state' || code === 'quota_exceeded' ? '저장 공간이 찼습니다. 반영된 사진을 정리해 주세요'
      : code === 'rate_limited' || code === 'resource_exhausted' ? '잠시 후 다시 올려 주세요' : `올리지 못했습니다 (${done}장 완료). 남은 사진으로 다시 올리기를 누르세요`);
  } finally { sending = false; updateSend(); }
};

/* ---------- 올린 사진 (PC · 폰 공통) ---------- */
function renderList() {
  const f = $('fSync').value, car = $('fCar').value, q = $('fq').value.trim().toLowerCase();
  const cs = [...new Set(uploads.map(u => u.car))].sort();
  $('fCar').innerHTML = `<option value="">차종 전체</option>` + cs.map(c => `<option ${c === car ? 'selected' : ''}>${esc(c)}</option>`).join('');
  const rows = uploads.filter(u => (f === 'all' || (f === 'done') === !!u.synced) && (!car || u.car === car) &&
    (!q || [u.part_no, u.part_name, u.problem, u.vendor, u.memo].join(' ').toLowerCase().includes(q)));
  const wait = uploads.filter(u => !u.synced).length;
  $('tabList').textContent = wait ? `올린 사진 (${wait})` : '올린 사진';
  $('fCount').textContent = `${rows.length}장`;
  $('cards').innerHTML = rows.length ? rows.map((u, i) => `<button class="card" type="button" data-i="${i}">
      <div class="th">${u.asset ? photoSVG('/_blob/' + u.asset, u.w, u.h, u.marks, true) : ''}</div>
      <div class="m"><span class="pn">${esc(u.part_no)}</span><span class="pname">${esc(u.part_name)} · ${esc(u.vendor)}</span>
        <span class="p">${u.l ? `L${esc(u.l)} · ` : '새 문제점 · '}${esc(u.problem)}</span>
        <span class="chips"><span class="chip">${u.grp === 'after' ? '수정 후' : '수정 전'}</span>${u.synced ? `<span class="chip ok">PC 반영 · L${esc(u.synced_l)}</span>` : '<span class="chip warn">PC 반영 대기</span>'}</span>
        <span class="when">${esc((u.at || '').slice(0, 16).replace('T', ' '))}${u.by && profiles[u.by]?.name ? ' · ' + esc(profiles[u.by].name) : ''}</span></div></button>`).join('')
    : `<div class="empty"><b>${f === 'wait' ? 'PC 반영을 기다리는 사진이 없습니다' : '올린 사진이 없습니다'}</b><span>[사진 올리기]에서 금형과 문제점을 고르고 촬영하면 여기에 쌓입니다.</span></div>`;
  $('cards').onclick = (e) => { const c = e.target.closest('[data-i]'); if (c) openPhoto(rows[+c.dataset.i]); };
}
['fSync', 'fCar'].forEach(id => $(id).onchange = renderList);
$('fq').oninput = renderList;
async function openPhoto(u) {
  const ov = document.createElement('div'); ov.className = 'ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', '사진 보기');
  const canDel = !u.synced && assets && (u.by === me || editor);
  ov.innerHTML = `<div class="bar"><span class="t">${esc(u.part_no)} · ${u.grp === 'after' ? '수정 후' : '수정 전'}</span>${canDel ? '<button class="btn sm" type="button" id="pvDel">지우기</button>' : ''}<button class="btn sm primary" type="button" id="pvClose">닫기</button></div>
    <div class="stage"><div class="big">${photoSVG('/_blob/' + u.asset, u.w, u.h, u.marks)}</div></div>
    <div class="info"><span><b>${esc(u.part_name)}</b> · ${esc(u.vendor)} · ${esc(u.car)}</span><span>${u.l ? `L${esc(u.l)} ` : '새 문제점 '}${esc(u.problem)}${u.category ? ` · ${esc(u.category)}` : ''}${u.importance ? ` · 중요도 ${esc(u.importance)}` : ''}</span>
      ${u.memo ? `<span>메모: ${esc(u.memo)}</span>` : ''}<span class="when">${esc((u.at || '').slice(0, 16).replace('T', ' '))} · ${u.synced ? `PC 반영됨 (L${esc(u.synced_l)})` : 'PC 반영 대기'}</span></div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true); };
  const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', onKey, true);
  ov.querySelector('#pvClose').onclick = close;
  const del = ov.querySelector('#pvDel');
  if (del) del.onclick = async () => {
    if (del.dataset.sure !== '1') { del.dataset.sure = '1'; del.textContent = '정말 지울까요? 한 번 더'; return; }
    try { await db.doc('uploads/' + u._id).delete(); for (const id of [u.asset, u.flat].filter(Boolean)) await assets.delete(id).catch(() => {}); close(); toast('지웠습니다'); }
    catch (e) { toast('지우지 못했습니다'); }
  };
}

/* ---------- 시작 ---------- */
show(location.hash === '#list' ? 'list' : 'up');
renderPicker(); renderTiles(); renderList(); updateSend();
(async () => {
  const C = window.claude;
  [db, assets, user] = C && C.use ? await Promise.all([C.use('db'), C.use('assets'), C.use('user')]) : [null, null, null];
  if (user) { try { me = await user.id(); editor = await user.canEdit(); } catch (e) { me = me || null; } }
  if (!db) { notice('저장소에 연결되지 않았습니다. claude.ai 에 로그인한 상태로 이 페이지를 여세요.'); updateSend(); return; }
  if (!assets) notice('이 계정은 사진을 볼 수만 있습니다. 올리려면 페이지 소유자에게 편집 권한을 요청하세요.');
  db.collection('catalog').onSnapshot((s) => { catalog = s.docs.map(d => d.data()); loaded = true; renderPicker(); if (sel.mold) renderIssues(); updateSend(); },
    () => notice('금형 목록을 불러오지 못했습니다. 새로 고침해 주세요.'));
  db.collection('uploads').orderBy('at', 'desc').limit(500).onSnapshot(async (s) => {
    uploads = s.docs.map(d => ({ ...d.data(), _id: d.id }));
    const ids = [...new Set(uploads.map(u => u.by).filter(Boolean))].filter(id => !profiles[id]);
    if (user && ids.length) { try { Object.assign(profiles, await user.profiles(ids)); } catch (e) { /* 이름 없이 표시 */ } }
    renderList();
  }, () => notice('올린 사진 목록을 불러오지 못했습니다. 새로 고침해 주세요.'));
  updateSend();
})();
})();
</script>
