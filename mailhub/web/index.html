<title>개발 업무 비서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 내비 + 상단 검색바 + 본문(목록·상세 2단). 사출부품 개발자의 하루 업무판 — 상태는 색 띠·칩으로 한눈에 */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --line: #dbe0e8; --line-2: #e8ecf1;
  --fg: #17202b; --fg-2: #586477; --fg-3: #8a94a5;
  --accent: #0e6a86; --accent-weak: #e0f0f5; --accent-fg: #ffffff;
  --crit: #c4362b; --crit-weak: #fbe9e7; --warn: #b9700c; --warn-weak: #fdf1df; --ok: #2b7d50; --ok-weak: #e3f3ea;
  --info: #3b5bb5; --info-weak: #e7ecfa; --mute-weak: #eceff3;
  --side: #17222e; --side-fg: #c9d3df; --side-fg-2: #7f8ea1; --side-active: #233344;
  --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #161d26; --surface-2: #1b232e; --line: #283241; --line-2: #212a36;
  --fg: #e5eaf0; --fg-2: #a2adbd; --fg-3: #6f7b8c;
  --accent: #4fb2cf; --accent-weak: #15303b; --accent-fg: #06222b;
  --crit: #f07468; --crit-weak: #3a1d1b; --warn: #e3a54a; --warn-weak: #36280f; --ok: #5cc28a; --ok-weak: #15301f;
  --info: #8ea7f0; --info-weak: #1d2640; --mute-weak: #222b37;
  --side: #0b1016; --side-fg: #c9d3df; --side-fg-2: #6f7d8f; --side-active: #1a2532;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #161d26; --surface-2: #1b232e; --line: #283241; --line-2: #212a36;
  --fg: #e5eaf0; --fg-2: #a2adbd; --fg-3: #6f7b8c;
  --accent: #4fb2cf; --accent-weak: #15303b; --accent-fg: #06222b;
  --crit: #f07468; --crit-weak: #3a1d1b; --warn: #e3a54a; --warn-weak: #36280f; --ok: #5cc28a; --ok-weak: #15301f;
  --info: #8ea7f0; --info-weak: #1d2640; --mute-weak: #222b37;
  --side: #0b1016; --side-fg: #c9d3df; --side-fg-2: #6f7d8f; --side-active: #1a2532;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 셸 ---------- */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; gap: 4px;
  padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.brand b { display: block; font-size: 15px; color: #fff; letter-spacing: -.01em; }
.brand span { font-size: 11px; color: var(--side-fg-2); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: var(--side-fg);
  text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--side-active); }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; min-width: 20px; text-align: center; padding: 1px 6px;
  border-radius: 10px; background: #2c3c4e; color: #dfe7f0; }
.nav .badge.crit { background: #8f2a22; color: #fff; }
.nav a.open { color: #fff; }
.subnav { display: grid; gap: 1px; margin: 2px 0 8px 22px; padding-left: 10px; border-left: 1px solid #2a3a4c; }
.nav a.sub-a { padding: 5px 8px; font-size: 13px; font-weight: 400; color: var(--side-fg-2); border-radius: 5px; }
.nav a.sub-a:hover { color: var(--side-fg); }
.nav a.sub-a[aria-current="page"] { color: #fff; background: var(--side-active); box-shadow: none; font-weight: 600; }
.nav .cnt { margin-left: auto; font-size: 11.5px; color: var(--side-fg-2); font-variant-numeric: tabular-nums; }
.nav .cnt.hot { color: #ffb4ab; font-weight: 600; }
.sub-sep { height: 1px; background: #2a3a4c; margin: 5px 8px; }
.nav a.sub-a.lvl1 { padding-left: 24px; font-size: 12.5px; }
.nav .caret { width: 0; height: 0; display: inline-block; margin: 0 2px 0 -2px; border: 4px solid transparent;
  border-left: 5px solid currentColor; border-right: 0; opacity: .7; transition: transform .15s; }
.nav .caret.open { transform: rotate(90deg); }
.sub-label { font-size: 10.5px; letter-spacing: .08em; color: var(--side-fg-2); padding: 2px 8px 0; opacity: .8; }
.subnav { max-height: 52vh; overflow-y: auto; }
.filters.mob { display: none; }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #243242; font-size: 12px; color: var(--side-fg-2);
  display: grid; gap: 6px; }
.mode { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.dot.live { background: #4ec98a; } .dot.demo { background: #e3a54a; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 12px; height: 38px; max-width: 640px; }
.search input[type=search]::-webkit-search-cancel-button { cursor: pointer; }
.search .btn { flex: none; }
.search input[type=search] { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; height: 100%; padding: 0; }
.search svg { width: 16px; height: 16px; color: var(--fg-3); flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn svg { width: 15px; height: 15px; }
.btn[disabled] { opacity: .55; cursor: default; }
.top .sync-time { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.demo-bar { background: var(--warn-weak); color: var(--warn); font-size: 12.5px; padding: 7px 20px; border-bottom: 1px solid var(--line); }
.demo-bar b { font-weight: 600; }

.view { flex: 1; overflow-y: auto; padding: 22px 24px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.view.split { padding: 0; overflow: hidden; display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); }
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 14px; margin: 0; font-weight: 600; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sub { color: var(--fg-2); font-size: 13px; }
.eyebrow { font-size: 11.5px; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }

/* ---------- 카드 · 칩 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.panel-h .sub { font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  background: var(--mute-weak); color: var(--fg-2); white-space: nowrap; }
.chip.crit { background: var(--crit-weak); color: var(--crit); }
.chip.warn { background: var(--warn-weak); color: var(--warn); }
.chip.ok { background: var(--ok-weak); color: var(--ok); }
.chip.info { background: var(--info-weak); color: var(--info); }
.chip.acc { background: var(--accent-weak); color: var(--accent); }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 15px; padding: 4px 11px; font-size: 12.5px; color: var(--fg-2); }
.filter[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.empty { padding: 28px 16px; text-align: center; color: var(--fg-3); font-size: 13px; }

/* 요약 타일 */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; text-align: left;
  display: grid; gap: 2px; position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.tile.crit::before { background: var(--crit); } .tile.warn::before { background: var(--warn); } .tile.ok::before { background: var(--ok); }
.tile:hover { border-color: var(--accent); }
.tile .k { font-size: 12px; color: var(--fg-2); font-weight: 500; }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .d { font-size: 11.5px; color: var(--fg-3); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }

/* 처리할 일 목록 */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 16px 11px 0;
  border-bottom: 1px solid var(--line-2); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row .sev { align-self: stretch; border-radius: 0 3px 3px 0; background: transparent; }
.row .sev.crit { background: var(--crit); } .row .sev.warn { background: var(--warn); } .row .sev.info { background: var(--info); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--fg-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row .r { display: grid; justify-items: end; gap: 3px; }
.kind { font-size: 11px; font-weight: 600; color: var(--fg-3); letter-spacing: .03em; }

/* 일정 */
.agenda { padding: 6px 16px 12px; display: grid; gap: 2px; }
.ag-day { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); }
.ag-day:last-child { border-bottom: 0; }
.ag-date { font-weight: 600; font-size: 13px; }
.ag-date small { display: block; font-weight: 500; font-size: 11px; color: var(--fg-3); }
.ag-date.today { color: var(--accent); }
.ag-items { display: grid; gap: 4px; min-width: 0; }
.ag-item { font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; min-width: 0; width: 100%; text-align: left; background: none; border: 0; padding: 3px 4px; margin: 0 -4px; border-radius: 6px; color: inherit; font: inherit; cursor: pointer; }
.ag-item:hover { background: var(--surface-2); }
.ag-item:hover span:last-child { color: var(--accent); text-decoration: underline; }
.car-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 16px; }
.tiles.car4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
button.tile { text-align: left; font: inherit; color: inherit; cursor: pointer; }
.seg { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.seg [role=tab] { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; font: inherit; font-size: 13.5px; color: var(--fg-2); cursor: pointer; margin-bottom: -1px; }
.seg [role=tab][aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.seg .seg-link { margin-left: auto; padding: 8px 4px; }
.rel-list .row { cursor: pointer; }
.rel-list .row[aria-selected="true"] { background: var(--accent-weak); }
.rel-mail { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 14px; }
.rel-mail h3 { font-size: 15px; margin: 0 0 8px; }
.note-box { font-size: 12.5px; color: var(--fg-2); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.ag-item span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 메일 2단 */
.list-pane { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.list-pane .pane-h { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line-2); }
.list-scroll { overflow-y: auto; flex: 1; }
.mrow { padding: 11px 16px; border-bottom: 1px solid var(--line-2); cursor: pointer; display: grid; gap: 3px; position: relative; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-selected="true"] { background: var(--accent-weak); }
.mrow .l1 { display: flex; gap: 8px; align-items: baseline; }
.mrow .from { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.mrow .date { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; }
.mrow .subj { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .snip { font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .star { position: absolute; left: 5px; top: 14px; width: 5px; height: 5px; border-radius: 50%; background: var(--crit); }
.mrow .pick, .bulk-h .pick { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); cursor: pointer; flex: none; align-self: center; }
.mrow.picked { background: var(--accent-weak); }
.list-scroll .btn.more { display: block; width: calc(100% - 32px); margin: 12px 16px 18px; }
.mrow .sent-ico { color: var(--accent); font-weight: 700; margin-right: 4px; }
.chip.sent { background: var(--accent-weak); color: var(--accent); }
.bulk-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 28px; font-size: 12.5px; color: var(--fg-2); }
.bulk-h label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.bulk-h .bulk-acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bulk-h .bulk-acts[hidden] { display: none; }
.bulk-h .cnt { font-weight: 600; color: var(--accent); }
.reader { overflow-y: auto; padding: 22px 28px 40px; padding-right: max(28px, env(safe-area-inset-right, 0px)); min-width: 0; }
.reader h1 { font-size: 18px; line-height: 1.4; }
.meta { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; margin: 14px 0; }
.meta dt { color: var(--fg-3); } .meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.body-text { white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px 18px; overflow-wrap: anywhere; max-width: 78ch; }
details.att { margin-top: 12px; max-width: 78ch; }
details.att summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--fg-2); padding: 6px 0; }
details.att pre { white-space: pre-wrap; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px; max-height: 320px; overflow: auto; margin: 0; }
.back { display: none; }

/* 표 */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; letter-spacing: .03em; color: var(--fg-3); font-weight: 600; padding: 9px 12px;
  border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t td.c { text-align: center; }
.clip { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { font-size: 12px; color: var(--fg-2); margin-top: 2px; }

/* E.O 단계 */
.stages { display: flex; gap: 0; margin-bottom: 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stage { flex: 1 0 auto; min-width: 96px; padding: 10px 14px; border-right: 1px solid var(--line-2); text-align: left; background: transparent; border-top: 0; border-bottom: 0; border-left: 0; }
.stage:last-child { border-right: 0; }
.stage .k { font-size: 11.5px; color: var(--fg-2); font-weight: 500; }
.stage .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stage[aria-pressed="true"] { background: var(--accent-weak); box-shadow: inset 0 -2px 0 var(--accent); }
.st { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }

/* 상세 서랍 */
.drawer-bg { position: fixed; inset: 0; background: rgba(10, 16, 24, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41;
  border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer.wide { width: min(1000px, 100%); }
.drawer.flush .drawer-b { padding: 0; display: block; overflow: hidden; flex: 1; }
iframe.orig { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
.drawer.flush .drawer-b { display: flex; flex-direction: column; }
.drawer.flush iframe.orig { flex: 1; height: auto; }
.orig-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.orig-text { padding: 16px 20px; overflow: auto; flex: 1; }
.orig-text h3 { margin: 0 0 10px; font-size: 16px; }
.orig-text table.mh { border-collapse: collapse; margin-bottom: 12px; font-size: 13px; } .orig-text .mh th { text-align: left; color: var(--fg-2); font-weight: 600; padding: 3px 12px 3px 0; vertical-align: top; white-space: nowrap; }
.hist-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 14px; margin-bottom: 16px; }
.hist-form #hist-q { flex: 1 1 320px; height: 34px; font-size: 14px; }
.hist-form select { height: 34px; }
.hist-recent { flex-basis: 100%; }
.hist-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.hist-stats > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 2px; }
.hist-stats b { font-size: 18px; } .hist-stats span { font-size: 12px; color: var(--fg-2); }
.hist-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.hist-acts label { display: flex; align-items: center; gap: 6px; margin-right: 6px; }
.hthread { margin-bottom: 12px; } .hthread h2 { font-size: 14px; margin: 0; }

const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

let LIVE = false;

  if (LIVE) {
    const r = await fetch('/api/' + path, opts ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(opts) } : undefined);
    if (!r.ok) { const t = await r.text(); throw new Error(t || r.statusText); }
    return r.json();
  }
  return demoApi(path, opts);
}

function buildDemo() {

function mdToHtml(src) {
  const lines = esc(src).replace(/\r/g, '').split('\n');
  const inline = (t) => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  let out = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) { let j = i + 1, buf = []; while (j < lines.length && !/^```/.test(lines[j])) buf.push(lines[j++]); out += `<pre>${buf.join('\n')}</pre>`; i = j + 1; continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const rows = []; while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !/^\s*\|[\s:\-|]+\|\s*$/.test(r));
      out += '<table>' + body.map((r, k) => `<tr>${cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('')}</tr>`).join('') + '</table>';
      continue;
    }
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { const n = Math.min(3, m[1].length + 1); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*([-*]|\d+[.)])\s+/.test(l)) {
      const ordered = /^\s*\d/.test(l); const items = [];
      while (i < lines.length && /^\s*([-*]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+[.)])\s+/, ''));
      out += (ordered ? '<ol>' : '<ul>') + items.map(x => `<li>${inline(x)}</li>`).join('') + (ordered ? '</ol>' : '</ul>');
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*\||```|\s*([-*]|\d+[.)])\s)/.test(lines[i])) para.push(lines[i++]);
    out += `<p>${inline(para.join('<br>'))}</p>`;
  }
  return out;
}

async function waitJob(path, onTick) {

}

// 차종 → 외주처 → 금형(갑지) → 문제점(을지). 사진 표시는 'DATA 수정 변경 검토서'와 같은 방식 (원본 위에 비율 좌표로 겹쳐 저장)

const LM_IMP = { '상': 'crit', '중': 'warn', '하': '' };

const MCOL = { r: '#e8261c', b: '#1565d8' }, MLAB = { r: '수정부위', b: '리워크부위' };
const r4 = n => Math.round(n * 10000) / 10000;
function markLW(W, H) { return Math.max(3, Math.max(W, H) / 140); }

    else if (m.t === 'rect') out += `<rect x="${Math.min(ax, bx)}" y="${Math.min(ay, by)}" width="${Math.abs(bx - ax)}" height="${Math.abs(by - ay)}" fill="none" stroke="${R}" stroke-width="${lw}" stroke-dasharray="${lw * 2.5} ${lw * 1.5}"/>`;
    else if (m.t === 'pen') out += `<polyline points="${parsePts(m.p).map(p => `${p.x * W},${p.y * H}`).join(' ')}" fill="none" stroke="${R}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/>`;
    else if (m.t === 'arrow') {
      const ang = Math.atan2(by - ay, bx - ax), h = lw * 4.2, hx = bx - h * 0.8 * Math.cos(ang), hy = by - h * 0.8 * Math.sin(ang);
      out += `<line x1="${ax}" y1="${ay}" x2="${hx}" y2="${hy}" stroke="${R}" stroke-width="${lw * 1.15}" stroke-linecap="round"/><polygon points="${bx},${by} ${bx - h * Math.cos(ang - 0.42)},${by - h * Math.sin(ang - 0.42)} ${bx - h * Math.cos(ang + 0.42)},${by - h * Math.sin(ang + 0.42)}" fill="${R}"/>`;

let lmCur = null;   // { id, mold, photos, activeGrp }

    ${id ? `<div class="chips">${pill(r.status)}${lmImp(r.importance)}${lmFlags(r)}${r.src_status ? `<span class="chip">양식 상태 ${esc(r.src_status)}</span>` : ''}<span class="chip">${esc(mold.vendor)}</span></div>` : ''}
    <form class="lm-form" id="lm-form" autocomplete="off">

      <label>발생일<input type="date" id="f-occ_date" value="${esc(r.occ_date)}"></label>

      <label class="full">수리 · 개선 대책 (MOLD IMPROVEMENT)<textarea id="f-countermeasure" placeholder="예: 재습합 진행, 경사코아 구배 적용 + 랩핑">${esc(r.countermeasure)}</textarea></label>
      <label>수정 목표일<input type="date" id="f-due" value="${esc(r.due)}"></label>
      <label>금형수정 대상<select id="f-mold_fix">${opt([['', '-'], ['O', 'O (금형 수정)'], ['X', 'X']], r.mold_fix)}</select></label>

    <div class="edit-row lm-save"><button class="btn primary" id="lm-save" type="button">${id ? '저장' : '등록'}</button>${id ? '<button class="btn sm" id="lm-del" type="button" style="margin-left:auto;color:var(--crit)">삭제</button>' : ''}<span class="sub" id="lm-msg"></span></div>
    ${prev ? `<div class="sect"><h3>이전 발생 L${prev.id} (${esc(prev.occ_date)})</h3><div class="case"><span><b>문제</b> ${esc(prev.problem)}</span><span><b>대책</b> ${esc(prev.countermeasure || '-')}</span><span><b>단계</b> ${esc(prev.status)} ${esc(prev.to_result || '')}</span></div></div>` : ''}
    ${guide ? `<div class="sect"><h3>불량 유형 가이드</h3><details class="att"><summary>${esc(r.defect_type)} 원인 · 대책</summary><pre>${esc(guide)}</pre></details></div>` : ''}
    ${log.length ? `<div class="sect"><h3>진행 이력</h3><ul class="timeline">${log.map(x => `<li><time>${esc((x.at || '').slice(5, 16).replace('T', ' '))}</time>${esc(x.what)} ${esc(x.note || '')}</li>`).join('')}</ul></div>` : ''}`, (L) => {

}
function lmFields(L) {
  const v = {};
  for (const k of ['problem', 'category', 'importance', 'occ_date', 'owner', 'countermeasure', 'due', 'mold_fix', 'to_after', 'to_result', 'progress', 'status']) v[k] = $('#f-' + k, L).value.trim();
  return v;
}
async function saveLmIssue(L, quiet) {
  const v = lmFields(L), note = $('#f-note', L).value.trim();
  if (!v.problem) { toast('문제점을 입력해 주세요'); return false; }
  if (v.status === '종결' && v.to_result !== 'OK' && !quiet && !confirm('수정 후 T/O 결과(OK)가 없습니다. 그래도 종결할까요?')) return false;
  try {
    if (!lmCur.id) { const r = await api('local/issue/add', { mold_id: lmCur.mold.id, ...v }); lmCur.id = r.id; if (note) await api('local/issue/' + r.id, { note }); }
    else await api('local/issue/' + lmCur.id, { ...v, note });
    $('#f-note', L).value = '';
    if (!quiet) { toast(LIVE ? `L${lmCur.id} 저장했습니다` : '예시 화면이라 다시 열면 원래대로입니다'); $('#layer').innerHTML = ''; route(); }
    return true;
  } catch (err) { toast('저장 실패: ' + err.message); return false; }
}
function renderLmGroups(L) {
  const box = $('#lm-groups', L); if (!box) return;
  box.innerHTML = Object.entries({ before: '수정 전 (문제 사진)', after: '수정 후 (개선 · 리워크 사진)' }).map(([g, label]) => {
    const list = lmCur.photos.filter(p => p.grp === g);
    return `<div class="lm-group${lmCur.activeGrp === g ? ' active' : ''}" data-grp="${g}">
      <div class="lm-glab"><b>${label}</b><span>${lmCur.activeGrp === g ? 'Ctrl+V 붙여넣기 대상 · ' : ''}${list.length ? list.length + '장' : ''}</span></div>
      <div class="lm-tiles">${list.map((p, i) => `<div class="lm-tile"><div class="lm-tim">${photoSVG(p)}${list.length > 1 ? `<span class="no">${i + 1}</span>` : ''}${p.source === 'phone' ? '<span class="src">폰</span>' : ''}</div>
        <div class="lm-tact"><button type="button" class="mk" data-act="mark" data-pid="${p.id}">○ 표시</button><button type="button" data-act="left" data-pid="${p.id}" ${i === 0 ? 'disabled' : ''} aria-label="앞으로">◀</button>
        <button type="button" data-act="right" data-pid="${p.id}" ${i === list.length - 1 ? 'disabled' : ''} aria-label="뒤로">▶</button><button type="button" data-act="del" data-pid="${p.id}" aria-label="삭제">✕</button></div></div>`).join('')}
        <div class="lm-tile"><div class="lm-add"><label class="btn sm">사진 촬영<input type="file" accept="image/*" capture="environment" data-up="${g}"></label>
          <label class="btn sm">파일 · 앨범<input type="file" accept="image/*" multiple data-up="${g}"></label><span>끌어놓기 · Ctrl+V</span></div></div></div></div>`;
  }).join('');
}
function setupLmDrop(L) {
  const box = $('#lm-groups', L);
  const grpOf = (el) => el?.closest?.('.lm-group');
  box.addEventListener('pointerdown', (e) => { const g = grpOf(e.target); if (g && lmCur.activeGrp !== g.dataset.grp) { lmCur.activeGrp = g.dataset.grp; box.querySelectorAll('.lm-group').forEach(x => x.classList.toggle('active', x === g)); } });
  box.addEventListener('change', (e) => { const inp = e.target.closest('[data-up]'); if (!inp) return; const files = [...inp.files]; inp.value = ''; lmAddFiles(L, inp.dataset.up, files); });
  box.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const pid = +b.dataset.pid, p = lmCur.photos.find(x => x.id === pid); if (!p) return;
    try {
      if (b.dataset.act === 'del') { if (!confirm('사진을 지울까요?')) return; await api(`local/photo/${pid}/del`, {}); lmCur.photos = lmCur.photos.filter(x => x.id !== pid); }
      else if (b.dataset.act === 'left' || b.dataset.act === 'right') {
        await api(`local/photo/${pid}/move`, { step: b.dataset.act === 'left' ? -1 : 1 });
        const g = lmCur.photos.filter(x => x.grp === p.grp), i = g.indexOf(p), j = i + (b.dataset.act === 'left' ? -1 : 1);
        if (j >= 0 && j < g.length) { const a = lmCur.photos.indexOf(g[i]), c = lmCur.photos.indexOf(g[j]); [lmCur.photos[a], lmCur.photos[c]] = [lmCur.photos[c], lmCur.photos[a]]; }
      } else if (b.dataset.act === 'mark') {
        const img = await loadImg(p.url).catch(() => null); if (!img) return toast('사진을 불러오지 못했습니다');
        const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0);
        const marks = await annotate(c, p.marks || [], p.grp); if (!marks) return;
        const r = await api(`local/photo/${pid}`, { marks, flat: marks.length ? flatten(c, marks) : '' });
        Object.assign(p, r.photo || { marks });
      }
    } catch (err) { toast('실패: ' + err.message); }
    renderLmGroups(L);
  });
  let depth = 0;
  box.addEventListener('dragenter', (e) => { const g = grpOf(e.target); if (!g || ![...(e.dataTransfer?.types || [])].includes('Files')) return; e.preventDefault(); depth++; g.classList.add('drag'); });
  box.addEventListener('dragover', (e) => { if (grpOf(e.target)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
  box.addEventListener('dragleave', (e) => { const g = grpOf(e.target); if (g && --depth <= 0) { depth = 0; g.classList.remove('drag'); } });
  box.addEventListener('drop', (e) => { const g = grpOf(e.target); if (!g) return; e.preventDefault(); depth = 0; g.classList.remove('drag'); lmCur.activeGrp = g.dataset.grp; lmAddFiles(L, g.dataset.grp, [...(e.dataTransfer?.files || [])]); });
}
document.addEventListener('paste', (e) => {
  const L = $('#layer'); if (!lmCur || !$('#lm-groups', L) || document.querySelector('.lm-mk')) return;
  const files = [...(e.clipboardData?.items || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  e.preventDefault(); lmAddFiles(L, lmCur.activeGrp || 'before', files);
});
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function shrink(file, max) {
  const url = URL.createObjectURL(file);
  try { const img = await loadImg(url); const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c; }
  finally { URL.revokeObjectURL(url); }
}
function flatten(base, marks) { const c = document.createElement('canvas'); c.width = base.width; c.height = base.height; const x = c.getContext('2d'); x.drawImage(base, 0, 0); drawMarks(x, marks, c.width, c.height); return c.toDataURL('image/jpeg', 0.86); }
async function lmAddFiles(L, grp, all) {
  const files = all.filter(f => /^image\//.test(f.type));
  if (!files.length) { if (all.length) toast('사진 파일만 넣을 수 있습니다'); return; }
  if (!lmCur.id) { const ok = await saveLmIssue(L, true); if (!ok) return; }   // 새 문제점은 먼저 등록하고 사진을 붙인다
  const msg = $('#lm-msg', L);
  for (const f of files) {
    try {
      const base = await shrink(f, 1800);
      let marks = [];
      if (files.length === 1) { const m = await annotate(base, [], grp); if (m === null) return; marks = m; }
      msg.textContent = '사진 올리는 중…';
      const r = await api(`local/issue/${lmCur.id}/photo`, { grp, data: base.toDataURL('image/jpeg', 0.86), marks, flat: marks.length ? flatten(base, marks) : '', w: base.width, h: base.height });
      if (r.photo) lmCur.photos.push(r.photo);
    } catch (err) { toast('사진을 올리지 못했습니다: ' + err.message); }
  }
  msg.textContent = files.length > 1 ? `${files.length}장을 넣었습니다. '○ 표시'로 수정부위를 표시할 수 있습니다` : '';
  renderLmGroups(L);
}

// ----- 표시 편집기: 동그라미+라벨 · 동그라미 · 화살표+라벨 · 사각 · 펜 / 수정부위(빨강) · 리워크부위(파랑) -----
function annotate(base, initial, grp) {
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'lm-mk'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-label', '수정 부위 표시');
    wrap.innerHTML = `<div class="bar"><span class="t">수정 부위 표시</span>
      ${[['circleL', '◎ 동그라미+라벨'], ['circle', '○ 동그라미'], ['arrow', '➜ 화살표+라벨'], ['rect', '□ 사각'], ['pen', '펜']].map(([k, l]) => `<button class="btn sm tool" type="button" data-tool="${k}">${l}</button>`).join('')}
      <span class="cols"><button class="btn sm col" type="button" data-col="r"><i style="background:${MCOL.r}"></i>수정부위</button><button class="btn sm col" type="button" data-col="b"><i style="background:${MCOL.b}"></i>리워크부위</button></span>
      <label class="lbl">라벨<input id="mk-label"></label></div>
      <div class="hint" id="mk-hint"></div><div class="stage"><canvas></canvas></div>
      <div class="bar"><button class="btn sm" type="button" id="mk-undo">되돌리기</button><button class="btn sm" type="button" id="mk-clear">모두 지우기</button><span style="flex:1"></span>
        <button class="btn sm" type="button" id="mk-cancel">취소</button><button class="btn sm primary" type="button" id="mk-done">적용</button></div>`;
    document.body.appendChild(wrap);
    const cv = $('canvas', wrap), ctx = cv.getContext('2d'); cv.width = base.width; cv.height = base.height;
    const W = cv.width, H = cv.height, minWH = Math.min(W, H), DEF_R = minWH * 0.08;
    let tool = 'circleL', marks = JSON.parse(JSON.stringify(initial || [])), drawing = null, col = grp === 'after' ? 'b' : 'r';
    const HINTS = { circleL: '표시할 부위를 <b>톡 누르면</b> 동그라미와 라벨 화살표가 함께 그려집니다. 누른 채 끌면 크기를 조절합니다.', circle: '표시할 부위를 <b>톡 누르거나</b> 끌어서 동그라미를 그립니다.',
      arrow: '라벨을 둘 자리에서 <b>수정 부위 쪽으로 끌어</b> 화살표를 그립니다.', rect: '끌어서 점선 사각형을 그립니다.', pen: '손가락 · 마우스로 자유롭게 그립니다.' };
    const setTool = (t) => { tool = t; wrap.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t)); $('#mk-hint', wrap).innerHTML = HINTS[t] + ' 원본 사진은 그대로 두고 표시만 겹쳐 저장합니다.'; };
    const setCol = (c) => { const lb = $('#mk-label', wrap); if (!lb.value.trim() || lb.value.trim() === MLAB[col]) lb.value = MLAB[c]; col = c; wrap.style.setProperty('--mc', MCOL[c]); wrap.querySelectorAll('.col').forEach(b => b.setAttribute('aria-pressed', b.dataset.col === c)); };
    $('#mk-label', wrap).value = MLAB[col]; setCol(col); setTool('circleL');
    wrap.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
    wrap.querySelectorAll('.col').forEach(b => b.addEventListener('click', () => setCol(b.dataset.col)));
    const draw = () => { ctx.drawImage(base, 0, 0); drawMarks(ctx, drawing ? [...marks, drawing] : marks, W, H); };
    const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: r4(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width))), y: r4(Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))) }; };
    const circleAt = (c, rpx) => ({ t: 'ellipse', a: { x: r4(c.x - rpx / W), y: r4(c.y - rpx / H) }, b: { x: r4(c.x + rpx / W), y: r4(c.y + rpx / H) } });
    const autoArrow = (cx, cy, pw, ph) => { const dx = cx < 0.5 ? 1 : -1, dy = cy < 0.5 ? 1 : -1, dd = 0.17 + Math.max(pw, ph) / 2;
      const tail = { x: r4(Math.min(0.88, Math.max(0.12, cx + dx * dd))), y: r4(Math.min(0.9, Math.max(0.1, cy + dy * dd * 0.75))) }, ang = Math.atan2(cy - tail.y, cx - tail.x);
      return { t: 'arrow', a: tail, b: { x: r4(cx - Math.cos(ang) * pw / 2 * 1.04), y: r4(cy - Math.sin(ang) * ph / 2 * 1.04) } }; };
    cv.onpointerdown = (e) => { cv.setPointerCapture(e.pointerId); const p = pos(e);
      if (tool === 'circle' || tool === 'circleL') { drawing = { ...circleAt(p, DEF_R), c: col, _c: p }; draw(); return; }
      drawing = tool === 'pen' ? { t: 'pen', p: [p], c: col } : { t: tool, a: p, b: p, c: col, ...(tool === 'arrow' ? { label: $('#mk-label', wrap).value.trim() } : {}) }; draw(); };
    cv.onpointermove = (e) => { if (!drawing) return; const p = pos(e);
      if (drawing._c) { const r = Math.hypot((p.x - drawing._c.x) * W, (p.y - drawing._c.y) * H); Object.assign(drawing, circleAt(drawing._c, Math.max(r, minWH * 0.02))); draw(); return; }
      if (drawing.t === 'pen') { drawing.p.push(p); } else drawing.b = p; draw(); };
    cv.onpointerup = cv.onpointercancel = () => { if (!drawing) return;
      const d = drawing; drawing = null;
      if (d.t === 'pen') { if (d.p.length > 1) marks.push({ t: 'pen', c: d.c, p: d.p.map(p => `${p.x},${p.y}`).join(';') }); }
      else if (d._c) { const m = { t: 'ellipse', a: d.a, b: d.b, c: d.c }; marks.push(m);
        if (tool === 'circleL') { const lab = $('#mk-label', wrap).value.trim(); marks.push({ ...autoArrow(d._c.x, d._c.y, Math.abs(d.b.x - d.a.x), Math.abs(d.b.y - d.a.y)), c: d.c, label: lab }); } }
      else if (Math.hypot((d.b.x - d.a.x) * W, (d.b.y - d.a.y) * H) > minWH * 0.02) { const { _c, ...m } = d; marks.push(m); }
      draw(); };
    const close = (v) => { wrap.remove(); document.removeEventListener('keydown', esc1, true); resolve(v); };
    const esc1 = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(null); } };
    document.addEventListener('keydown', esc1, true);
    $('#mk-undo', wrap).onclick = () => { marks.pop(); draw(); };
    $('#mk-clear', wrap).onclick = () => { marks = []; draw(); };
    $('#mk-cancel', wrap).onclick = () => close(null);
    $('#mk-done', wrap).onclick = () => close(marks);
    draw();
  });
}

// ================= 라우팅·시작 =================
const VIEWS = { today: viewToday, mail: viewMail, hist: viewHist, req: viewReq, eo: viewEO, to: viewTO, local: viewLocal, mold: viewMold };
async function route() {
  const k = (location.hash || '#today').slice(1);
  let fn = VIEWS[k] || viewToday;
  if (k.startsWith('mail')) {   // 메일함 폴더
    const f = folderOf(k);
    if (mailState.filter !== f[2] && !PENDING) mailState.sel = null;   // 다른 폴더로 가면 선택 해제
    mailState.filter = f[2];
    fn = viewMail;
  }
  try { renderNav(window.__counts || {}); } catch (e) { console.error(e); }
  $('#layer').innerHTML = '';
  try { await fn($('#view')); } catch (e) { $('#view').innerHTML = `<div class="empty">화면을 불러오지 못했습니다: ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', route);
function runSearch() {
  mailState.q = $('#q').value.trim(); mailState.sel = null;
  // 위 검색창은 어느 폴더에 있든 전체 메일에서 찾는다 (폴더 안에서만 찾다 보니 안 나오는 일이 있었음)
  if ((location.hash || '') !== '#mail') location.hash = '#mail'; else route();
}
$('#search-form').addEventListener('submit', (e) => { e.preventDefault(); runSearch(); });
// 한글 입력 중(마지막 글자 조합 중)에 Enter 를 누르면 검색이 안 되는 경우가 있어, 조합이 끝나면 검색
let searchAfterIME = false;
$('#q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) { searchAfterIME = true; e.preventDefault(); }
});
$('#q').addEventListener('compositionend', () => { if (searchAfterIME) { searchAfterIME = false; setTimeout(runSearch, 0); } });
$('#q').addEventListener('search', () => { if (!$('#q').value && mailState.q) runSearch(); });   // ✕ 로 지우면 검색 해제
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-export]'); if (!b) return;
  b.disabled = true; try { await api('export/' + b.dataset.export, {}); toast('엑셀을 만들어 열었습니다'); } finally { b.disabled = false; }
});
$('#sync-btn').addEventListener('click', async () => {
  const b = $('#sync-btn'); b.disabled = true; b.lastChild.textContent = ' 받는 중…';
  try { const r = await api('sync', {}); toast(r.message || `새 메일 ${r.added}건`); await refreshSummary(); route(); }
  catch (err) { toast('메일 받기 실패: ' + err.message); }

});
async function refreshSent() {
  try { const st = await api('sentmove'); $('#sent-bar').hidden = !st.show; } catch { /* 무시 */ }
}
$('#sent-done').addEventListener('click', async () => {
  const b = $('#sent-done'); b.disabled = true; b.textContent = '수집 중…';
  try { const st = await api('sentmove', {}); toast(st.sent_today ? `오늘 보낸 메일 ${st.sent_today}건을 백업했습니다` : '아직 보낸 메일이 들어오지 않았습니다. 받은편지함으로 옮겼는지 확인하세요'); $('#sent-bar').hidden = !st.show; await refreshSummary(); route(); }
  catch (err) { toast('수집 실패: ' + err.message); }
  finally { b.disabled = false; b.textContent = '옮겼어요 · 지금 수집'; }

setInterval(refreshSent, 5 * 60 * 1000);
async function refreshSummary() {

  catch (e) { window.__mcErr = e.message || String(e); }
  try { const s = await api('summary'); window.__counts = s.counts; renderNav(s.counts);
    const t = s.last_sync ? `마지막 수집 ${md(s.last_sync.slice(0, 10))} ${s.last_sync.slice(11, 16)}` : '마지막 수집 -';
    $('#last-sync').textContent = t; $('#sync-time').textContent = t; } catch { /* 요약 실패는 무시 */ }
}
const APP_VERSION = '2026-11-12.2';   // webapp.py 의 APP_VERSION 과 같게
// 화면에서 오류가 나면 빈 화면 대신 이유를 보여준다
function showFatal(msg) {
  const V = $('#view');
  if (!V) return;
  V.className = 'view';
  V.innerHTML = `<div class="panel" style="max-width:720px;padding:18px 20px;border-color:var(--crit)">
    <h2 style="color:var(--crit)">화면을 그리는 중 오류가 났습니다</h2>
    <p class="sub" style="margin:8px 0">앱을 완전히 껐다 켜면 대부분 해결됩니다: 작업 표시줄의 작은 검은 창 <b>업무 비서</b>를 닫고 다시 실행하세요.
    그래도 같으면 아래 내용을 캡처해서 보내 주세요.</p>
    <pre style="white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:6px;font-size:12px;margin:0">${esc(msg)}</pre>
    <div style="margin-top:12px"><button class="btn sm" type="button" onclick="location.reload()">다시 불러오기</button></div></div>`;
}
window.addEventListener('error', (e) => showFatal((e.message || '') + (e.filename ? `\n${e.filename}:${e.lineno}` : '')));
window.addEventListener('unhandledrejection', (e) => showFatal(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
async function start() {
  let serverVersion = '';
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 1500);
    const r = await fetch('/api/ping', { signal: ctl.signal });
    if (r.ok) { const j = await r.json(); LIVE = !!j.ok; serverVersion = j.version || '예전 버전'; }
  } catch { LIVE = false; }
  $('#mode-dot').className = 'dot ' + (LIVE ? 'live' : 'demo');
  $('#mode-text').textContent = LIVE ? '내 PC 데이터 연결됨' : '예시 데이터';
  $('#demo-bar').hidden = LIVE;
  if (LIVE && serverVersion !== APP_VERSION) {   // 업데이트했는데 예전 엔진이 켜져 있는 경우
    const bar = $('#demo-bar');
    bar.hidden = false;
    bar.innerHTML = `<b>앱을 다시 켜 주세요</b> · 화면은 새 버전인데 앱 엔진은 예전 버전(${esc(serverVersion)})입니다. 작업 표시줄의 작은 검은 창 <b>업무 비서</b>를 닫고 바탕화면 아이콘으로 다시 실행하세요.`;
  }
  renderNav({});
  route();                       // 화면 먼저, 건수는 뒤에서 채움
  await refreshSummary();
  const h1 = $('.list-pane h1');   // 차종 폴더 이름(BC4 → BC4t)은 건수를 받은 뒤 알 수 있음
  if (h1 && !mailState.q && curHash().startsWith('mail')) h1.textContent = folderTitle(mailState.filter);
  refreshSent();
  // 처음 켤 때 예전 메일의 차종 정보를 채우는 중일 수 있으므로 잠시 뒤 한 번 더
  if (LIVE && !((window.__mailcounts || {}).cars || []).length) setTimeout(refreshSummary, 15000);
}
start();
})();
