<title>개발 업무 비서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽 내비 + 상단 검색바 + 본문(목록·상세 2단). 사출부품 개발자의 하루 업무판 — 상태는 색 띠·칩으로 한눈에 */
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f5f7fa; --line: #dbe0e8; --line-2: #e8ecf1;
  --fg: #17202b; --fg-2: #586477; --fg-3: #8a94a5;
  --accent: #0e6a86; --accent-weak: #e0f0f5; --accent-fg: #ffffff;
  --crit: #c4362b; --crit-weak: #fbe9e7; --warn: #b9700c; --warn-weak: #fdf1df; --ok: #2b7d50; --ok-weak: #e3f3ea;
  --info: #3b5bb5; --info-weak: #e7ecfa; --mute-weak: #eceff3;
  --side: #17222e; --side-fg: #c9d3df; --side-fg-2: #7f8ea1; --side-active: #233344;
  --font: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #161d26; --surface-2: #1b232e; --line: #283241; --line-2: #212a36;
  --fg: #e5eaf0; --fg-2: #a2adbd; --fg-3: #6f7b8c;
  --accent: #4fb2cf; --accent-weak: #15303b; --accent-fg: #06222b;
  --crit: #f07468; --crit-weak: #3a1d1b; --warn: #e3a54a; --warn-weak: #36280f; --ok: #5cc28a; --ok-weak: #15301f;
  --info: #8ea7f0; --info-weak: #1d2640; --mute-weak: #222b37;
  --side: #0b1016; --side-fg: #c9d3df; --side-fg-2: #6f7d8f; --side-active: #1a2532;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #161d26; --surface-2: #1b232e; --line: #283241; --line-2: #212a36;
  --fg: #e5eaf0; --fg-2: #a2adbd; --fg-3: #6f7b8c;
  --accent: #4fb2cf; --accent-weak: #15303b; --accent-fg: #06222b;
  --crit: #f07468; --crit-weak: #3a1d1b; --warn: #e3a54a; --warn-weak: #36280f; --ok: #5cc28a; --ok-weak: #15301f;
  --info: #8ea7f0; --info-weak: #1d2640; --mute-weak: #222b37;
  --side: #0b1016; --side-fg: #c9d3df; --side-fg-2: #6f7d8f; --side-active: #1a2532;
  color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 셸 ---------- */
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); height: 100%; }
.side { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; gap: 4px;
  padding: 18px 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-fg);
  display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.brand b { display: block; font-size: 15px; color: #fff; letter-spacing: -.01em; }
.brand span { font-size: 11px; color: var(--side-fg-2); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 6px; color: var(--side-fg);
  text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--side-active); }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; min-width: 20px; text-align: center; padding: 1px 6px;
  border-radius: 10px; background: #2c3c4e; color: #dfe7f0; }
.nav .badge.crit { background: #8f2a22; color: #fff; }
.side-foot { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid #243242; font-size: 12px; color: var(--side-fg-2);
  display: grid; gap: 6px; }
.mode { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.dot.live { background: #4ec98a; } .dot.demo { background: #e3a54a; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 20px; padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 0 12px; height: 38px; max-width: 640px; }
.search input[type=text] { border: 0; background: transparent; outline: none; flex: 1; min-width: 0; height: 100%; padding: 0; }
.search svg { width: 16px; height: 16px; color: var(--fg-3); flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn svg { width: 15px; height: 15px; }
.btn[disabled] { opacity: .55; cursor: default; }
.top .sync-time { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.demo-bar { background: var(--warn-weak); color: var(--warn); font-size: 12.5px; padding: 7px 20px; border-bottom: 1px solid var(--line); }
.demo-bar b { font-weight: 600; }

.view { flex: 1; overflow-y: auto; padding: 22px 24px 40px; padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.view.split { padding: 0; overflow: hidden; display: grid; grid-template-columns: minmax(300px, 420px) minmax(0, 1fr); }
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 14px; margin: 0; font-weight: 600; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.sub { color: var(--fg-2); font-size: 13px; }
.eyebrow { font-size: 11.5px; letter-spacing: .06em; color: var(--fg-3); font-weight: 600; }

/* ---------- 카드 · 칩 ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); }
.panel-h .sub { font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  background: var(--mute-weak); color: var(--fg-2); white-space: nowrap; }
.chip.crit { background: var(--crit-weak); color: var(--crit); }
.chip.warn { background: var(--warn-weak); color: var(--warn); }
.chip.ok { background: var(--ok-weak); color: var(--ok); }
.chip.info { background: var(--info-weak); color: var(--info); }
.chip.acc { background: var(--accent-weak); color: var(--accent); }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1px solid var(--line); background: var(--surface); border-radius: 15px; padding: 4px 11px; font-size: 12.5px; color: var(--fg-2); }
.filter[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.empty { padding: 28px 16px; text-align: center; color: var(--fg-3); font-size: 13px; }

/* 요약 타일 */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; text-align: left;
  display: grid; gap: 2px; position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--line); }
.tile.crit::before { background: var(--crit); } .tile.warn::before { background: var(--warn); } .tile.ok::before { background: var(--ok); }
.tile:hover { border-color: var(--accent); }
.tile .k { font-size: 12px; color: var(--fg-2); font-weight: 500; }
.tile .v { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .d { font-size: 11.5px; color: var(--fg-3); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }

/* 처리할 일 목록 */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 16px 11px 0;
  border-bottom: 1px solid var(--line-2); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row .sev { align-self: stretch; border-radius: 0 3px 3px 0; background: transparent; }
.row .sev.crit { background: var(--crit); } .row .sev.warn { background: var(--warn); } .row .sev.info { background: var(--info); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 12px; color: var(--fg-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row .r { display: grid; justify-items: end; gap: 3px; }
.kind { font-size: 11px; font-weight: 600; color: var(--fg-3); letter-spacing: .03em; }

/* 일정 */
.agenda { padding: 6px 16px 12px; display: grid; gap: 2px; }
.ag-day { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line-2); }
.ag-day:last-child { border-bottom: 0; }
.ag-date { font-weight: 600; font-size: 13px; }
.ag-date small { display: block; font-weight: 500; font-size: 11px; color: var(--fg-3); }
.ag-date.today { color: var(--accent); }
.ag-items { display: grid; gap: 4px; min-width: 0; }
.ag-item { font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.ag-item span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 메일 2단 */
.list-pane { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.list-pane .pane-h { padding: 14px 16px 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line-2); }
.list-scroll { overflow-y: auto; flex: 1; }
.mrow { padding: 11px 16px; border-bottom: 1px solid var(--line-2); cursor: pointer; display: grid; gap: 3px; position: relative; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-selected="true"] { background: var(--accent-weak); }
.mrow .l1 { display: flex; gap: 8px; align-items: baseline; }
.mrow .from { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.mrow .date { font-size: 11.5px; color: var(--fg-3); white-space: nowrap; }
.mrow .subj { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .snip { font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .star { position: absolute; left: 5px; top: 14px; width: 5px; height: 5px; border-radius: 50%; background: var(--crit); }
.reader { overflow-y: auto; padding: 22px 28px 40px; padding-right: max(28px, env(safe-area-inset-right, 0px)); min-width: 0; }
.reader h1 { font-size: 18px; line-height: 1.4; }
.meta { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 10px; font-size: 13px; margin: 14px 0; }
.meta dt { color: var(--fg-3); } .meta dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 18px; }
.body-text { white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px 18px; overflow-wrap: anywhere; max-width: 78ch; }
details.att { margin-top: 12px; max-width: 78ch; }
details.att summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--fg-2); padding: 6px 0; }
details.att pre { white-space: pre-wrap; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px; max-height: 320px; overflow: auto; margin: 0; }
.back { display: none; }

/* 표 */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; letter-spacing: .03em; color: var(--fg-3); font-weight: 600; padding: 9px 12px;
  border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; white-space: nowrap; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t td.c { text-align: center; }
.clip { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { font-size: 12px; color: var(--fg-2); margin-top: 2px; }

/* E.O 단계 */
.stages { display: flex; gap: 0; margin-bottom: 16px; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.stage { flex: 1 0 auto; min-width: 96px; padding: 10px 14px; border-right: 1px solid var(--line-2); text-align: left; background: transparent; border-top: 0; border-bottom: 0; border-left: 0; }
.stage:last-child { border-right: 0; }
.stage .k { font-size: 11.5px; color: var(--fg-2); font-weight: 500; }
.stage .v { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stage[aria-pressed="true"] { background: var(--accent-weak); box-shadow: inset 0 -2px 0 var(--accent); }
.st { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }

/* 상세 서랍 */
.drawer-bg { position: fixed; inset: 0; background: rgba(10, 16, 24, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41;
  border-left: 1px solid var(--line); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { font-size: 16px; line-height: 1.4; flex: 1; }
.drawer-b { overflow-y: auto; padding: 16px 20px 28px; display: grid; gap: 18px; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.sect h3 { font-size: 12px; letter-spacing: .05em; color: var(--fg-3); margin: 0 0 8px; font-weight: 600; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 10px; }
.timeline li { position: relative; font-size: 12.5px; }
.timeline li::before { content: ""; position: absolute; left: -20px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.timeline time { color: var(--fg-3); font-size: 11.5px; margin-right: 6px; }
.edit { display: grid; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.edit-row { display: flex; gap: 8px; flex-wrap: wrap; }
select, input[type=text], textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 9px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 56px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.thumbs figure { margin: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.thumbs img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.thumbs figcaption { font-size: 11px; color: var(--fg-2); padding: 4px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.case { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px; font-size: 12.5px; }
.case b { font-size: 13px; }

/* 결함 분포 막대 */
.bars { display: grid; gap: 6px; padding: 12px 16px 14px; }
.bar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: 12px; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bar .fill.open { background: var(--warn); }

/* 금형 매트릭스 */
table.matrix td.doc { text-align: center; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.d-확정 { background: var(--ok-weak); color: var(--ok); }
.d-검토중, .d-접수 { background: var(--warn-weak); color: var(--warn); }
.d-요청 { background: var(--info-weak); color: var(--info); }
.d-미접수 { background: var(--crit-weak); color: var(--crit); }
.d-해당없음 { background: var(--mute-weak); color: var(--fg-3); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); }
.legend span { display: inline-flex; gap: 4px; align-items: center; }
.legend i { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 18px; border-radius: 3px; font-size: 11px; font-weight: 700; }

/* 토스트 */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  background: var(--fg); color: var(--surface); padding: 10px 16px; border-radius: 8px; font-size: 13px; max-width: calc(100% - 32px);
  box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.copybox { display: flex; gap: 8px; align-items: center; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
.copybox code { font-family: var(--mono); flex: 1; min-width: 0; overflow-wrap: anywhere; }

@media (max-width: 1100px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid2 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .side { flex-direction: row; align-items: center; padding: 8px 12px; gap: 6px; overflow-x: auto;
    padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .brand { padding: 0 6px 0 0; } .brand div { display: none; }
  .nav { display: flex; gap: 2px; }
  .nav a { padding: 7px 10px; white-space: nowrap; } .nav a svg { display: none; }
  .nav a[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--accent); }
  .side-foot { display: none; }
  .top { padding: 10px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
  .top .sync-time { display: none; }
  .view { padding: 16px 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .view.split { grid-template-columns: minmax(0, 1fr); }
  .view.split.reading .list-pane { display: none; }

    return { issue: { ...r, delay: toDelay(r) }, previous: prev, similar: sim, log: [{ at: r.to_date + 'T10:00', what: '등록', note: r.recur_of ? `재발: T${r.recur_of}` : '' }], mails: [], images: [], guide: r.defect_type === '싱크' ? GUIDE_SINK : '' };

    <dl class="kv"><dt>부품</dt><dd>${esc(r.car)} <span class="mono">${esc(r.part_no)}</span></dd><dt>T/O</dt><dd>${esc(r.to_stage)} ${md(r.to_date)} · ${esc(r.mold_vendor || '')} · ${esc(r.resin || '')}</dd>
      <dt>현상</dt><dd>${esc((r.location ? r.location + ' · ' : '') + r.phenomenon)}</dd>
      <dt>원인</dt><dd>${r.cause ? `<span class="chip">${esc(r.cause_cat)}</span> ${esc(r.cause)}` : '<span class="sub">미확인</span>'}</dd>
      <dt>대책</dt><dd>${r.countermeasure ? `<span class="chip">${esc(r.action_cat)}</span> ${esc(r.countermeasure)}` : '<span class="sub">없음</span>'}</dd>
      <dt>목표</dt><dd class="num">대책 ${md(r.due) || '-'} · 효과 확인 ${md(r.verify_due) || '-'}</dd>
      ${r.result ? `<dt>효과</dt><dd>${esc(r.effective)} · ${esc(r.result)}</dd>` : ''}</dl>
    ${p ? `<div class="sect"><h3>이전 발생 T${p.id} (${esc(p.to_stage)})</h3><div class="case"><span><b>원인</b> ${esc(p.cause)}</span><span><b>대책</b> ${esc(p.countermeasure)}</span><span><b>결과</b> ${esc(p.effective)} · ${esc(p.result)}</span></div></div>` : ''}
    <div class="edit"><h3 class="eyebrow" style="margin:0">진행 단계 바꾸기</h3>
      <div class="edit-row"><select id="to-st">${STAGE_TO.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
        <input type="text" id="to-note" placeholder="메모" style="flex:1"><button class="btn primary sm" id="to-save" type="button">저장</button></div></div>
    ${claudeBox('/to-advice ' + r.id, '개선 방법 조언')}
    <div class="sect"><h3>비슷한 과거 사례</h3>${(d.similar || []).length ? d.similar.slice(0, 4).map(x => `<div class="case"><b>T${x.id} ${esc(x.part_name)} · ${esc(x.defect_type)} <span class="sub">${esc(x.to_stage)}</span></b>
      <span class="sub">${esc((x.why || []).join(' · '))}</span>${x.countermeasure ? `<span>대책: ${esc(x.countermeasure)}</span>` : ''}${x.effective ? `<span>효과: ${esc(x.effective)} ${esc(x.result || '')}</span>` : ''}</div>`).join('') : '<div class="sub">비슷한 사례가 아직 없습니다</div>'}</div>
    ${d.guide ? `<div class="sect"><h3>불량 유형 가이드</h3><details class="att" open><summary>${esc(r.defect_type)} 원인·대책</summary><pre>${esc(d.guide)}</pre></details></div>` : ''}
    ${d.images && d.images.length ? `<div class="sect"><h3>사진</h3><div class="thumbs">${d.images.map(im => `<figure><img src="${esc(im.url)}" alt="${esc(im.caption)}" loading="lazy"><figcaption>${esc(im.caption)}</figcaption></figure>`).join('')}</div></div>` : ''}`, (L) => {
      $('#to-save', L).addEventListener('click', async () => { await api('to/' + id, { status: $('#to-st', L).value, note: $('#to-note', L).value }); L.innerHTML = ''; toast(LIVE ? `T${id} 저장했습니다` : '예시 화면이라 저장되지 않습니다'); route(); });
    });
}

// ================= 화면: 금형 이관 =================
async function viewMold(V) {
  const rows = await api('molds');
  const secs = SECTIONS;
  const ship = rows.filter(m => m.ship && (m.ship.etd || m.ship.eta)).sort((a, b) => (a.ship.etd || '9').localeCompare(b.ship.etd || '9'));
  V.className = 'view';
  V.innerHTML = `
    <div class="head"><div><h1>금형 이관 종합장</h1><div class="sub">현지 법인 이관 금형별 서류 · 리스트 · 선적. 칸을 누르면 상태를 바꿀 수 있습니다</div></div>
      <div class="chips">${LIVE ? '<button class="btn sm" data-export="mold" type="button">엑셀로 열기</button>' : ''}</div></div>
    <div class="legend" style="margin-bottom:10px">${['확정', '접수', '요청', '미접수', '해당없음'].map(s => `<span><i class="d-${s}">${SYMBOL[s]}</i>${s === '접수' ? '접수·검토중' : s}</span>`).join('')}</div>
    <section class="panel"><div class="table-wrap"><table class="t matrix">
      <thead><tr><th>금형</th><th>품명 · 이관</th><th>상태</th>${secs.map(s => `<th style="text-align:center">${s}</th>`).join('')}<th>확인 필요</th></tr></thead>
      <tbody>${rows.map(m => `<tr data-id="${m.id}"><td><span class="mono">M${m.id}</span><div class="desc mono">${esc(m.mold_no)}</div></td>
        <td><b>${esc(m.part_name)}</b><div class="desc">${esc(m.car)} · → ${esc(m.dest)}</div></td><td>${pill(m.status)}</td>
        ${secs.map(s => { const d = m.docs[s] || ['', '']; return `<td class="doc d-${esc(d[0])}" data-sec="${s}" title="${esc(d[0])}">${SYMBOL[d[0]] || ''} <span class="num" style="font-weight:500">${md(d[1])}</span></td>`; }).join('')}
        <td>${(m.alerts || []).map(a => `<div class="chip crit" style="white-space:normal">${esc(a)}</div>`).join('')}</td></tr>`).join('')}</tbody></table></div></section>
    <div style="height:16px"></div>
    <div class="grid2">
      <section class="panel"><div class="panel-h"><h2>선적 일정</h2><span class="sub">ETD 순</span></div>
        <div class="table-wrap"><table class="t"><thead><tr><th>금형</th><th>ETD</th><th>ETA</th><th>상태</th><th>경로</th><th>B/L</th></tr></thead>
        <tbody>${ship.map(m => { const s = m.ship; const n = days(s.etd); const st = s.ata ? '<span class="chip ok">도착</span>' : (s.atd ? '<span class="chip info">운송 중</span>' : (s.etd ? `<span class="chip ${n < 0 ? 'crit' : (n <= 14 ? 'warn' : '')}">${n < 0 ? -n + '일 지남' : 'D-' + n}</span>` : ''));
          return `<tr data-id="${m.id}"><td class="mono">${esc(m.mold_no)}</td><td class="num">${md(s.etd)}</td><td class="num">${md(s.eta)}</td><td>${st}</td><td>${esc([s.port_from, s.port_to].filter(Boolean).join(' → '))}</td><td class="mono">${esc(s.bl_no || '')}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">선적 일정이 없습니다</td></tr>'}</tbody></table></div></section>
      <section class="panel"><div class="panel-h"><h2>메일로 받은 서류 반영</h2></div><div style="padding:14px 16px;display:grid;gap:10px">
        <div class="sub">사양서·성형조건표·KD/원소재 리스트 메일을 받으면 메일 번호로 반영합니다. 첨부는 금형별 폴더에 보관되고, 엑셀 리스트는 품목까지 불러옵니다.</div>
        ${claudeBox('/mold-update', '메일 반영')}</div></section>
    </div>`;
  V.querySelectorAll('.matrix tbody tr').forEach(tr => tr.addEventListener('click', (e) => {
    const td = e.target.closest('td[data-sec]');
    if (td) { e.stopPropagation(); return docPicker(+tr.dataset.id, td.dataset.sec); }
    openMold(+tr.dataset.id);
  }));
  if (PENDING && PENDING.view === 'mold') { const id = PENDING.id; PENDING = null; openMold(id); }
}
function docPicker(id, sec) {
  drawer(`M${id} · ${esc(sec)}`, `<div class="edit"><h3 class="eyebrow" style="margin:0">상태</h3>
    <div class="edit-row">${['미접수', '요청', '접수', '검토중', '확정', '해당없음'].map(s => `<button class="btn sm" data-s="${s}" type="button"><span class="chip d-${s === '검토중' ? '접수' : s}" style="padding:0 5px">${SYMBOL[s]}</span>${s}</button>`).join('')}</div></div>
    <div class="sub">첨부파일 보관과 엑셀 리스트 불러오기는 메일 번호로 합니다:</div>${claudeBox(`/mold-update`, '복사')}`, (L) => {
      L.querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', async () => { await api(`mold/${id}/doc`, { section: sec, status: b.dataset.s }); L.innerHTML = ''; toast(LIVE ? `${sec} → ${b.dataset.s}` : '예시 화면이라 저장되지 않습니다'); route(); }));
    });
}
async function openMold(id) {
  const d = await api('mold/' + id), m = d.mold, s = m.ship || {};
  drawer(`M${m.id} · ${esc(m.mold_no)} ${esc(m.part_name)}`, `
    <div class="chips">${pill(m.status)}${(m.alerts || []).map(a => `<span class="chip crit">${esc(a)}</span>`).join('')}</div>
    <dl class="kv"><dt>차종 · 품번</dt><dd>${esc(m.car)} <span class="mono">${esc(m.part_no || '')}</span></dd><dt>금형업체</dt><dd>${esc(m.mold_vendor)}</dd><dt>이관 법인</dt><dd>${esc(m.dest)}</dd>
      <dt>선적</dt><dd class="num">ETD ${md(s.etd) || '-'} · ETA ${md(s.eta) || '-'} ${s.atd ? '· 출항 ' + md(s.atd) : ''} ${s.ata ? '· 도착 ' + md(s.ata) : ''}</dd>
      ${s.bl_no ? `<dt>B/L</dt><dd class="mono">${esc(s.bl_no)}</dd>` : ''}
      <dt>리스트</dt><dd>부품 ${d.items?.부품 ?? 0} · KD ${d.items?.KD ?? 0} · 원소재 ${d.items?.원소재 ?? 0}건</dd></dl>
    <div class="sect"><h3>서류</h3><div style="display:grid;gap:6px">${SECTIONS.map(sec => { const x = m.docs[sec] || ['미접수', '']; return `<div style="display:flex;gap:8px;align-items:center"><span class="chip d-${esc(x[0])}" style="min-width:66px;justify-content:center">${SYMBOL[x[0]] || ''} ${esc(x[0])}</span><span style="flex:1">${sec}</span><span class="sub num">${md(x[1])}</span></div>`; }).join('')}</div></div>
    <div class="sect"><h3>진행 이력</h3><ul class="timeline">${(d.log || []).map(x => `<li><time>${esc((x.at || '').slice(5, 16).replace('T', ' '))}</time>${esc(x.what)} ${esc(x.note || '')}</li>`).join('')}</ul></div>
    ${claudeBox('/mold-update', '메일 반영')}`);
}

// ================= 라우팅·시작 =================
const VIEWS = { today: viewToday, mail: viewMail, req: viewReq, eo: viewEO, to: viewTO, mold: viewMold };
async function route() {
  const k = (location.hash || '#today').slice(1);
  const fn = VIEWS[k] || viewToday;
  renderNav(window.__counts || {});
  $('#layer').innerHTML = '';
  try { await fn($('#view')); } catch (e) { $('#view').innerHTML = `<div class="empty">화면을 불러오지 못했습니다: ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', route);
$('#search-form').addEventListener('submit', (e) => { e.preventDefault(); mailState.q = $('#q').value.trim(); mailState.sel = null; if (location.hash !== '#mail') location.hash = '#mail'; else route(); });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-export]'); if (!b) return;
  b.disabled = true; try { await api('export/' + b.dataset.export, {}); toast('엑셀을 만들어 열었습니다'); } finally { b.disabled = false; }
});
$('#sync-btn').addEventListener('click', async () => {
  const b = $('#sync-btn'); b.disabled = true; b.lastChild.textContent = ' 받는 중…';
  try { const r = await api('sync', {}); toast(r.message || `새 메일 ${r.added}건`); await refreshSummary(); route(); }
  catch (err) { toast('메일 받기 실패: ' + err.message); }
  finally { b.disabled = false; b.lastChild.textContent = ' 새 메일 받기'; }
});
async function refreshSummary() {
  try { const s = await api('summary'); window.__counts = s.counts; renderNav(s.counts);
    const t = s.last_sync ? `마지막 수집 ${md(s.last_sync.slice(0, 10))} ${s.last_sync.slice(11, 16)}` : '마지막 수집 -';
    $('#last-sync').textContent = t; $('#sync-time').textContent = t; } catch { /* 요약 실패는 무시 */ }
}
async function start() {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 1500);
    const r = await fetch('/api/ping', { signal: ctl.signal });
    if (r.ok && (await r.json()).ok) LIVE = true;
  } catch { LIVE = false; }
  $('#mode-dot').className = 'dot ' + (LIVE ? 'live' : 'demo');
  $('#mode-text').textContent = LIVE ? '내 PC 데이터 연결됨' : '예시 데이터';
  $('#demo-bar').hidden = LIVE;
  await refreshSummary();
  route();
}
start();
})();
</script>
